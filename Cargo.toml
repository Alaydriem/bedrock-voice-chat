[workspace]
members = [
    "common",
    "common/websocket-types",
    "client/src-tauri",
    "client/e2e-harness",
    "relay/lib",
    "relay/sdk",
    "relay/testpeer",
]
resolver = "2"

[profile.release]
opt-level = 3
strip = true
debug = false
codegen-units = 4
lto = true
incremental = false

[profile.dev]
opt-level = 1
debug = 1
strip = "symbols"
incremental = true
codegen-units = 4

[workspace.dependencies]
# Shared across common + client.
# When server-side equivalents exist, mirror these in server/Cargo.toml's
# [workspace.dependencies] so both workspaces stay on the same versions.
nanoid = { version = "^0.5" }
# Locked at 0.8 — rocket_okapi/OpenAPI stack does not yet support schemars 1.x.
schemars = { version = "0.8" }
opus2 = { version = "^0.4" }
x509-parser = { version = "^0.18" }
if-addrs = { version = "^0.15" }
# nano-wal pinned at 0.5 — 1.0 is POSIX-only (uses std::os::fd + libc::preadv
# without cfg gates) and does not compile on Windows desktop targets.
nano-wal = { version = "^0.5" }
hickory-resolver = { version = "^0.26", default-features = false, features = ["serde", "tokio"] }
rubato = { version = "^2" }
audioadapter-buffers = { version = "^3" }

[patch.crates-io]
tauri-plugin-deep-link = { git = "https://github.com/charlesportwoodii/tauri-plugin-deep-link", branch = "master" }
sentry = { git = "https://github.com/Alaydriem/sentry-rust", branch = "0.46.x" }
sentry-rust-minidump = { git = "https://github.com/Alaydriem/sentry-rust-minidump", branch = "master" }
# Mirrored from bedrock-protocol-rs's own [patch.crates-io]. A `[patch]` in a
# dependency's manifest is inert — only the workspace root's is honoured — so this
# entry is what decides which webrtc the client links. Pinned to a commit rather
# than the branch: `larger-buffer-size` moves, and this revision is the one
# carrying the Windows IPv6 ifaces byte-order fix and TURN ALTERNATE-SERVER
# (300 Try Alternate) handling, without which Realms cannot connect once TURN
# authentication is enforced.
webrtc = { git = "https://github.com/alaydriem/webrtc", rev = "6f07e0cf" }