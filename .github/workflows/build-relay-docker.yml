name: Build Registry Docker

on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag for the image'
        required: true
        type: string
      push:
        description: 'Push the image to the registry'
        required: false
        default: false
        type: boolean
      latest:
        description: 'Also tag the image :latest (release tags only)'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      push:
        description: 'Push the image to the registry'
        required: false
        default: false
        type: boolean
      latest:
        description: 'Also tag the image :latest (release tags only)'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alaydriem/bedrock-voice-chat/registry

jobs:
  build-registry:
    name: Build Multi-Arch Registry Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download amd64 artifact
        uses: actions/download-artifact@v5
        with:
          name: bvc-relay-service-amd64
          path: relay/service/binaries/amd64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v5
        with:
          name: bvc-relay-service-arm64
          path: relay/service/binaries/arm64

      - name: Prepare binaries
        run: |
          mv relay/service/binaries/amd64/bvc-relay-service-amd64 relay/service/binaries/amd64/bvc-relay-service
          mv relay/service/binaries/arm64/bvc-relay-service-arm64 relay/service/binaries/arm64/bvc-relay-service
          chmod +x relay/service/binaries/amd64/bvc-relay-service
          chmod +x relay/service/binaries/arm64/bvc-relay-service
          ls -la relay/service/binaries/amd64/
          ls -la relay/service/binaries/arm64/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./relay/service
          file: ./relay/service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image information
        run: |
          {
            echo "## Registry Image Published"
            echo ""
            echo "| Name | Value |"
            echo "| ---- | ----- |"
            echo "| Registry | ${{ env.REGISTRY }} |"
            echo "| Image | ${{ env.IMAGE_NAME }} |"
            echo "| Version | ${{ inputs.version }} |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo "| Pull Command | \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}\` |"
          } >> $GITHUB_STEP_SUMMARY
