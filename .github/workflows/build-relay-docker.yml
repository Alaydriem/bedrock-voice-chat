name: Build Relay Docker

on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag for the image'
        required: true
        type: string
      push:
        description: 'Push the image to the registry'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      push:
        description: 'Push the image to the registry'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alaydriem/bedrock-voice-chat/relay

jobs:
  build-relay:
    name: Build Multi-Arch Relay Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup private cargo deps auth
        uses: ./.github/actions/setup-private-cargo-deps
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The relay protocol is tied to the iroh release, and a mismatch fails when
      # a peer relays rather than when the image builds. This reads the version
      # the code is actually pinned to instead of trusting the Dockerfile default.
      - name: Resolve the iroh version relay/lib is built against
        id: iroh
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --format-version 1 --manifest-path relay/lib/Cargo.toml \
            | jq -r '.packages[] | select(.name == "iroh") | .version')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "relay image will pin iroh $version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./relay/n0
          file: ./relay/n0/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          build-args: |
            IROH_VERSION=${{ steps.iroh.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output image information
        run: |
          {
            echo "## Relay Image Published"
            echo ""
            echo "| Name | Value |"
            echo "| ---- | ----- |"
            echo "| Registry | ${{ env.REGISTRY }} |"
            echo "| Image | ${{ env.IMAGE_NAME }} |"
            echo "| Version | ${{ inputs.version }} |"
            echo "| iroh | ${{ steps.iroh.outputs.version }} |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo "| Pull Command | \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}\` |"
          } >> $GITHUB_STEP_SUMMARY
