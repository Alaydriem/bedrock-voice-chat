name: Build Relay SDK Natives

on:
  workflow_call:
    inputs:
      build_mode:
        description: 'Cargo profile for the cdylib (debug or release)'
        required: false
        default: 'debug'
        type: string
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Cargo profile for the cdylib'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # One runner per platform. The cdylib is loaded by JNA at runtime, so a jar
  # missing an architecture is not a build failure anywhere — it is a plugin that
  # will not start on that host.
  #
  # This runs at the same tier as build-server.yml: the mod builds hash these
  # libraries into native-manifest.json, so they must exist before the mod builds
  # start, not after.
  natives:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    env:
      # Compiled into `bvc-relay`, which this cdylib links, and presented to the
      # iroh relay as a bearer token. This is the build that reaches the Java mods:
      # they download this native rather than compiling any Rust, so a token absent
      # here is a token absent from every mod.
      #
      # Not a secret — it ships inside the binary — so an unset value is not a
      # failure: it expands to empty, which `PeerEndpoint::access_token` treats as
      # absent, and the native then reaches a relay that admits everyone. That keeps
      # a fork building without this repository's secrets.
      BVC_RELAY_ACCESS_TOKEN: ${{ secrets.RELAY_ACCESS_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # `label` is the BVC platform id: it names the artifact, and it is the
        # directory name NativePlatform.id resolves to at runtime.
        include:
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            jna_prefix: win32-x86-64
            artifact_name: bvc_relay_sdk.dll
          - label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            jna_prefix: linux-x86-64
            artifact_name: libbvc_relay_sdk.so
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            jna_prefix: linux-aarch64
            artifact_name: libbvc_relay_sdk.so
          - label: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            jna_prefix: darwin-aarch64
            artifact_name: libbvc_relay_sdk.dylib
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup private cargo deps auth
        uses: ./.github/actions/setup-private-cargo-deps
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: relay-sdk-${{ matrix.label }}-${{ inputs.build_mode || 'debug' }}

      - name: Build the cdylib
        run: cargo build -p bvc-relay-sdk --target ${{ matrix.target }} ${{ inputs.build_mode == 'release' && '--release' || '' }}

      # Two layouts of the same bytes, because the two consumers disagree about
      # where a native lives. JNA resolves a bare name from its own prefixes, which
      # is how uniffi's generated bindings load the SDK; the mods read
      # native/<platform>/, which is the directory generateNativeManifest hashes.
      - name: Stage both layouts
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ inputs.build_mode == 'release' && 'release' || 'debug' }}"
          src="target/${{ matrix.target }}/$mode/${{ matrix.artifact_name }}"

          mkdir -p "jna/${{ matrix.jna_prefix }}" "mod/${{ matrix.label }}"
          cp "$src" "jna/${{ matrix.jna_prefix }}/${{ matrix.artifact_name }}"
          cp "$src" "mod/${{ matrix.label }}/${{ matrix.artifact_name }}"

          ls -la "jna/${{ matrix.jna_prefix }}/" "mod/${{ matrix.label }}/"

      - name: Upload the library (JNA layout)
        uses: actions/upload-artifact@v4
        with:
          name: relay-sdk-native-${{ matrix.label }}
          path: jna/
          if-no-files-found: error
          retention-days: 30

      # Unpacks directly into mods/java/common/src/main/resources/native/, so the
      # platform directory is the artifact root rather than native/<platform>/.
      - name: Upload the library (mod layout)
        uses: actions/upload-artifact@v4
        with:
          name: relay-sdk-modnative-${{ matrix.label }}
          path: mod/
          if-no-files-found: error
          retention-days: 30
