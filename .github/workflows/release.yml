name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as draft release (tag created, GH release is draft)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  actions: read

env:
  NODE_VERSION: '25'

jobs:
  # Job 1: Determine if there's a release and get the version
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.semantic.outputs.new_release_published }}
      new_version: ${{ steps.semantic.outputs.new_release_version }}
      new_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      build_number: ${{ steps.build-number.outputs.build_number }}
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure draft release
        if: inputs.draft == true
        run: |
          # Update .releaserc.json to create draft release
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('.releaserc.json', 'utf8'));
            // Find and update @semantic-release/github plugin
            config.plugins = config.plugins.map(plugin => {
              if (Array.isArray(plugin) && plugin[0] === '@semantic-release/github') {
                plugin[1] = { ...plugin[1], draftRelease: true };
              } else if (plugin === '@semantic-release/github') {
                return ['@semantic-release/github', { draftRelease: true }];
              }
              return plugin;
            });
            fs.writeFileSync('.releaserc.json', JSON.stringify(config, null, 2));
            console.log('Updated .releaserc.json for draft release');
          "

      - name: Acquire release lock
        uses: ./.github/actions/release-lock
        with:
          operation: acquire
          redis_url: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          redis_token: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: ${{ inputs.dry_run }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Get build number
        id: build-number
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/get-build-number
        with:
          redis_url: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          redis_token: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          ref: ${{ github.ref }}
          version: ${{ steps.semantic.outputs.new_release_version }}
          track: ${{ github.ref == 'refs/heads/beta' && 'Beta Early Access' || 'production' }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Semantic Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.semantic.outputs.new_release_published }}" = "true" ]; then
            echo "New release: **v${{ steps.semantic.outputs.new_release_version }}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Tag: \`${{ steps.semantic.outputs.new_release_git_tag }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "No new release needed based on commits." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dry run: ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "Draft: ${{ inputs.draft }}" >> $GITHUB_STEP_SUMMARY

  # Job 2: Notify Sentry of new build/release
  notify-sentry:
    name: Notify Sentry
    needs: prepare-release
    if: needs.prepare-release.outputs.new_release == 'true' && inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - name: Notify Sentry (build)
        continue-on-error: true
        run: |
          curl "${{ secrets.SENTRY_RELEASE_WEBHOOK_URL }}" \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"version": "${{ needs.prepare-release.outputs.build_number }}"}'

      - name: Notify Sentry (version)
        continue-on-error: true
        run: |
          curl "${{ secrets.SENTRY_RELEASE_WEBHOOK_URL }}" \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"version": "${{ needs.prepare-release.outputs.new_version }}"}'

  # Job 3: Create mods release tag + GH release using the main release version
  prepare-mods-release:
    name: Prepare Mods Release
    needs: [prepare-release, build-server]
    if: needs.prepare-release.outputs.new_release == 'true' && needs.build-server.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.version.outputs.published }}
      new_release_version: ${{ steps.version.outputs.version }}
      new_release_git_tag: ${{ steps.version.outputs.tag }}
      new_release_notes: ${{ steps.version.outputs.notes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          show-progress: false
          ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}

      - name: Set version outputs
        id: version
        run: |
          VERSION="${{ needs.prepare-release.outputs.new_version }}"
          TAG="mods-v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "published=true" >> $GITHUB_OUTPUT
          echo "notes=Mod builds for Bedrock Voice Chat v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create mods release tag and GitHub release
        if: inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-release.outputs.new_version }}"
          TAG="mods-v${VERSION}"
          REF="${{ needs.prepare-release.outputs.new_tag }}"

          git tag "${TAG}" "${REF}" 2>/dev/null || echo "Tag ${TAG} already exists"
          git push origin "${TAG}" 2>/dev/null || echo "Tag ${TAG} already pushed"

          gh release create "${TAG}" \
            --title "Mods v${VERSION}" \
            --notes "Mod builds for Bedrock Voice Chat v${VERSION}" \
            ${{ inputs.draft == true && '--draft' || '' }} \
            ${{ contains(needs.prepare-release.outputs.new_version, '-') && '--prerelease' || '' }} \
            2>/dev/null || echo "Release for ${TAG} already exists"

      - name: Summary
        run: |
          VERSION="${{ needs.prepare-release.outputs.new_version }}"
          TAG="mods-v${VERSION}"
          {
              echo "## Mods Release ${VERSION}"
              echo ""
              echo "| Name | Value |"
              echo "| ---- | ----- |"
              echo "| Version | ${VERSION} |"
              echo "| Tag | ${TAG} |"
              echo "| Dry Run | ${{ inputs.dry_run && 'Yes' || 'No' }} |"
          } >> $GITHUB_STEP_SUMMARY

  # Job 4: Build server (release mode, Docker push gated by approve-publish)
  build-server:
    name: Build Server (release)
    needs: prepare-release
    if: needs.prepare-release.outputs.new_release == 'true'
    uses: ./.github/workflows/build-server.yml
    with:
      build_mode: release
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
    secrets: inherit

  # Workspace tests (common + client + server) at the release ref. Advisory only:
  # runs and reports, but does not gate asset upload or any downstream release job.
  tests:
    name: Tests
    needs: prepare-release
    if: needs.prepare-release.outputs.new_release == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
    secrets: inherit

  # Job 4: Build Android (release mode, includes signing)
  build-android:
    name: Build Android (release)
    needs: prepare-release
    if: needs.prepare-release.outputs.new_release == 'true'
    uses: ./.github/workflows/build-android.yml
    with:
      build_mode: release
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
      version: ${{ needs.prepare-release.outputs.new_version }}
      build_number: ${{ needs.prepare-release.outputs.build_number }}
      play_store_track: ${{ !inputs.dry_run && (github.ref == 'refs/heads/beta' && 'Beta Early Access' || 'production') || '' }}
    secrets: inherit

  # Job 5: Build iOS client (release mode, signed + TestFlight upload)
  build-ios:
    name: Build iOS (release)
    needs: prepare-release
    if: needs.prepare-release.outputs.new_release == 'true'
    uses: ./.github/workflows/build-ios.yml
    with:
      build_mode: release
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
      version: ${{ needs.prepare-release.outputs.new_version }}
      build_number: ${{ needs.prepare-release.outputs.build_number }}
      testflight_upload: ${{ !inputs.dry_run }}
    secrets: inherit

  # Job 6: Build Windows client (release mode)
  build-client:
    name: Build Windows (release)
    needs: prepare-release
    if: needs.prepare-release.outputs.new_release == 'true'
    uses: ./.github/workflows/build-client.yml
    with:
      build_mode: release
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
      version: ${{ needs.prepare-release.outputs.new_version }}
      build_number: ${{ needs.prepare-release.outputs.build_number }}
      store_release: true
    secrets: inherit

  # Job 6: Build macOS client (release mode, signed + TestFlight upload)
  build-macos-client:
    name: Build macOS (release)
    needs: prepare-release
    if: needs.prepare-release.outputs.new_release == 'true'
    uses: ./.github/workflows/build-macos-client.yml
    with:
      build_mode: release
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
      version: ${{ needs.prepare-release.outputs.new_version }}
      build_number: ${{ needs.prepare-release.outputs.build_number }}
      testflight_upload: ${{ !inputs.dry_run }}
    secrets: inherit

  # Job 7: Build Linux client (release mode, x86_64 + aarch64)
  build-linux-client:
    name: Build Linux (release)
    needs: prepare-release
    if: needs.prepare-release.outputs.new_release == 'true'
    uses: ./.github/workflows/build-linux-client.yml
    with:
      build_mode: release
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
      version: ${{ needs.prepare-release.outputs.new_version }}
      build_number: ${{ needs.prepare-release.outputs.build_number }}
    secrets: inherit

  # Job 8: Build Fabric Mod
  build-mod-fabric:
    name: Build Fabric Mod
    needs: [prepare-release, prepare-mods-release]
    if: needs.prepare-mods-release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/build-mod-fabric.yml
    with:
      version: ${{ needs.prepare-mods-release.outputs.new_release_version }}
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
      artifact_run_id: ${{ github.run_id }}
    secrets: inherit

  # Job 9: Build Paper Plugin
  build-mod-paper:
    name: Build Paper Plugin
    needs: [prepare-release, prepare-mods-release]
    if: needs.prepare-mods-release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/build-mod-paper.yml
    with:
      version: ${{ needs.prepare-mods-release.outputs.new_release_version }}
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
      artifact_run_id: ${{ github.run_id }}
    secrets: inherit

  # Job 11: Build BDS Pack
  build-mod-bds:
    name: Build BDS Pack
    needs: [prepare-release, prepare-mods-release]
    if: needs.prepare-mods-release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/build-mod-bds.yml
    with:
      version: ${{ needs.prepare-mods-release.outputs.new_release_version }}
      ref: ${{ inputs.dry_run && github.ref || needs.prepare-release.outputs.new_tag }}
    secrets: inherit

  # Job 12: Upload client/server release assets to GitHub
  upload-assets:
    name: Upload Release Assets
    needs: [prepare-release, build-server, build-android, build-ios, build-client, build-macos-client, build-linux-client]
    if: always() && needs.prepare-release.outputs.new_release == 'true' && inputs.dry_run == false && (needs.build-server.result == 'success' || needs.build-android.result == 'success' || needs.build-ios.result == 'success' || needs.build-client.result == 'success' || needs.build-macos-client.result == 'success' || needs.build-linux-client.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          pattern: bvc-*
          merge-multiple: false

      - name: List all artifacts
        run: |
          echo "=== All downloaded artifacts ==="
          find ./artifacts -type f -ls

      - name: Prepare release files
        run: |
          mkdir -p release-files
          VERSION="${{ needs.prepare-release.outputs.new_version }}"

          # Server binaries
          if [ -f "./artifacts/bvc-server-x86_64-pc-windows-msvc-release/bvc-server-x86_64-pc-windows-msvc-release.exe" ]; then
            cp "./artifacts/bvc-server-x86_64-pc-windows-msvc-release/bvc-server-x86_64-pc-windows-msvc-release.exe" ./release-files/bvc-server-windows-x64.exe
          fi

          if [ -f ./artifacts/bvc-server-x86_64-unknown-linux-musl-release/bvc-server-x86_64-unknown-linux-musl-release ]; then
            cp ./artifacts/bvc-server-x86_64-unknown-linux-musl-release/bvc-server-x86_64-unknown-linux-musl-release ./release-files/bvc-server-linux-x64
          fi

          if [ -f ./artifacts/bvc-server-aarch64-unknown-linux-musl-release/bvc-server-aarch64-unknown-linux-musl-release ]; then
            cp ./artifacts/bvc-server-aarch64-unknown-linux-musl-release/bvc-server-aarch64-unknown-linux-musl-release ./release-files/bvc-server-linux-arm64
          fi

          # Windows client
          if [ -f "./artifacts/bvc-windows-release/bvc-windows-release.exe" ]; then
            cp "./artifacts/bvc-windows-release/bvc-windows-release.exe" ./release-files/bvc-client-windows-x64.exe
          fi

          # Signed Android artifacts (from build-android.yml)
          if [ -f "./artifacts/bvc-android-release-signed-apk/bvc-android-release-signed.apk" ]; then
            cp "./artifacts/bvc-android-release-signed-apk/bvc-android-release-signed.apk" ./release-files/bvc-android-${VERSION}.apk
          fi

          # iOS signed IPA
          if [ -f "./artifacts/bvc-ios-release-signed-ipa/bvc-ios-release.ipa" ]; then
            cp "./artifacts/bvc-ios-release-signed-ipa/bvc-ios-release.ipa" ./release-files/bvc-ios-${VERSION}.ipa
          fi

          # macOS client (.app.zip for direct download)
          if [ -f "./artifacts/bvc-macos-release/bvc-macos-release.app.zip" ]; then
            cp "./artifacts/bvc-macos-release/bvc-macos-release.app.zip" ./release-files/bvc-client-macos-arm64.app.zip
          fi

          # macOS signed pkg (for App Store / TestFlight)
          if [ -f "./artifacts/bvc-macos-release-signed-pkg/bvc-macos-release.pkg" ]; then
            cp "./artifacts/bvc-macos-release-signed-pkg/bvc-macos-release.pkg" ./release-files/bvc-macos-${VERSION}.pkg
          fi

          # macOS updater bundle + signature (for auto-updater)
          if [ -f "./artifacts/bvc-macos-updater/bvc-macos-updater.app.tar.gz" ]; then
            cp "./artifacts/bvc-macos-updater/bvc-macos-updater.app.tar.gz" ./release-files/bvc-client-macos-arm64-updater.app.tar.gz
          fi
          if [ -f "./artifacts/bvc-macos-updater/bvc-macos-updater.app.tar.gz.sig" ]; then
            cp "./artifacts/bvc-macos-updater/bvc-macos-updater.app.tar.gz.sig" ./release-files/bvc-client-macos-arm64-updater.app.tar.gz.sig
          fi

          # Linux AppImage clients (self-updating, one per arch)
          if [ -f "./artifacts/bvc-linux-x86_64-appimage/bvc-client-linux-x86_64.AppImage" ]; then
            cp "./artifacts/bvc-linux-x86_64-appimage/bvc-client-linux-x86_64.AppImage" ./release-files/bvc-client-linux-x86_64.AppImage
          fi
          if [ -f "./artifacts/bvc-linux-aarch64-appimage/bvc-client-linux-aarch64.AppImage" ]; then
            cp "./artifacts/bvc-linux-aarch64-appimage/bvc-client-linux-aarch64.AppImage" ./release-files/bvc-client-linux-aarch64.AppImage
          fi

          # Linux .deb packages (install-only, no auto-update)
          if [ -f "./artifacts/bvc-linux-x86_64-deb/bvc-client-linux-x86_64.deb" ]; then
            cp "./artifacts/bvc-linux-x86_64-deb/bvc-client-linux-x86_64.deb" ./release-files/bvc-client-linux-x86_64.deb
          fi
          if [ -f "./artifacts/bvc-linux-aarch64-deb/bvc-client-linux-aarch64.deb" ]; then
            cp "./artifacts/bvc-linux-aarch64-deb/bvc-client-linux-aarch64.deb" ./release-files/bvc-client-linux-aarch64.deb
          fi

          # Windows NSIS installer (for manual download)
          if [ -f "./artifacts/bvc-windows-nsis-setup/bvc-windows-nsis-setup.exe" ]; then
            cp "./artifacts/bvc-windows-nsis-setup/bvc-windows-nsis-setup.exe" ./release-files/bvc-client-windows-x64-setup.exe
          fi

          # Windows MSIX (for Microsoft Store submission)
          if [ -f "./artifacts/bvc-windows-msix/bvc-client-windows-x64.msix" ]; then
            cp "./artifacts/bvc-windows-msix/bvc-client-windows-x64.msix" ./release-files/bvc-client-windows-x64.msix
          fi

          # Windows updater exe + signature (for auto-updater)
          if [ -f "./artifacts/bvc-windows-updater/bvc-windows-updater.exe" ]; then
            cp "./artifacts/bvc-windows-updater/bvc-windows-updater.exe" ./release-files/bvc-client-windows-x64-updater.exe
          fi
          if [ -f "./artifacts/bvc-windows-updater/bvc-windows-updater.exe.sig" ]; then
            cp "./artifacts/bvc-windows-updater/bvc-windows-updater.exe.sig" ./release-files/bvc-client-windows-x64-updater.exe.sig
          fi

          echo "=== Release files prepared ==="
          ls -la ./release-files/

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.new_version }}
          files: ./release-files/*
          draft: ${{ inputs.draft }}
          prerelease: ${{ contains(needs.prepare-release.outputs.new_version, '-') }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Release summary
        run: |
          VERSION="${{ needs.prepare-release.outputs.new_version }}"
          echo "## Release Assets Uploaded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **v${VERSION}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in ./release-files/*; do
            if [ -f "$file" ]; then
              echo "- \`$(basename $file)\`" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # Release the Redis lock held for the duration of the release
  release-lock:
    name: Release Build Lock
    needs: [prepare-release, upload-assets, upload-mod-release-assets]
    if: always() && needs.prepare-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.new_tag || github.ref }}

      - name: Release lock
        uses: ./.github/actions/release-lock
        with:
          operation: release
          redis_url: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          redis_token: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

  # Gate: Approval required before publishing to external services
  approve-publish:
    name: Approve Release Publish
    needs: [prepare-release, upload-assets, upload-mod-release-assets, release-lock]
    if: always() && needs.prepare-release.outputs.new_release == 'true' && inputs.dry_run == false && needs.upload-assets.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Approve
        run: echo "Release publish approved for v${{ needs.prepare-release.outputs.new_version }}"

  # Job 13: Publish Fabric to Modrinth
  publish-modrinth-fabric:
    name: Publish Fabric to Modrinth
    needs: [prepare-mods-release, build-mod-fabric, approve-publish]
    if: needs.approve-publish.result == 'success' && needs.prepare-mods-release.outputs.new_release_published == 'true' && needs.build-mod-fabric.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: bedrock-voice-chat-fabric-${{ needs.prepare-mods-release.outputs.new_release_version }}
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRITH_PAT }}
          project: ${{ secrets.MODRITH_ID }}
          # The bundled jar is primary: it carries every platform and cannot fail at
          # first start. The skinny jar is published beside it for operators whose
          # host can reach GitHub and who want the small download.
          files: |-
            ./artifacts/bedrock-voice-chat-${{ needs.prepare-mods-release.outputs.new_release_version }}-bundled.jar
            ./artifacts/bedrock-voice-chat-${{ needs.prepare-mods-release.outputs.new_release_version }}.jar
          primary-file: bedrock-voice-chat-${{ needs.prepare-mods-release.outputs.new_release_version }}-bundled.jar
          version: ${{ needs.prepare-mods-release.outputs.new_release_version }}
          name: Bedrock Voice Chat ${{ needs.prepare-mods-release.outputs.new_release_version }} (Fabric)
          changelog: ${{ needs.prepare-mods-release.outputs.new_release_notes }}
          dependencies: |-
            [{
              "project_id": "P7dR8mSH",
              "dependency_type": "required"
            }]
          loaders: |-
            fabric
          game-versions: |-
            26.2
          channel: ${{ github.ref_name == 'beta' && 'beta' || 'release' }}

  # Job 13b: Publish the native libraries the skinny jar resolves at runtime.
  #
  # Must run after the mod build, because the manifest baked into both jars pins
  # these assets by digest and by name. A release whose assets are missing or
  # misnamed produces a skinny jar that verifies nothing and downloads nothing.
  upload-native-assets:
    name: Upload native libraries to the mods release
    needs: [prepare-mods-release, build-mod-paper]
    if: needs.prepare-mods-release.outputs.new_release_published == 'true' && needs.build-mod-paper.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download native release assets
        uses: actions/download-artifact@v5
        with:
          name: native-release-assets
          path: ./release-natives

      - name: Upload to the mods release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="mods-v${{ needs.prepare-mods-release.outputs.new_release_version }}"
          ls -lh ./release-natives
          gh release upload "${TAG}" ./release-natives/* --clobber \
            --repo ${{ github.repository }}

  # Job 14: Publish Paper to Modrinth
  publish-modrinth-paper:
    name: Publish Paper to Modrinth
    needs: [prepare-mods-release, build-mod-paper, approve-publish]
    if: needs.approve-publish.result == 'success' && needs.prepare-mods-release.outputs.new_release_published == 'true' && needs.build-mod-paper.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: bedrock-voice-chat-paper-${{ needs.prepare-mods-release.outputs.new_release_version }}
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRITH_PAT }}
          project: ${{ secrets.MODRITH_ID }}
          # The bundled jar is primary: it carries every platform and cannot fail at
          # first start. The skinny jar is published beside it for operators whose
          # host can reach GitHub and who want the small download.
          files: |-
            ./artifacts/bedrock-voice-chat-paper-${{ needs.prepare-mods-release.outputs.new_release_version }}-bundled.jar
            ./artifacts/bedrock-voice-chat-paper-${{ needs.prepare-mods-release.outputs.new_release_version }}.jar
          primary-file: bedrock-voice-chat-paper-${{ needs.prepare-mods-release.outputs.new_release_version }}-bundled.jar
          version: ${{ needs.prepare-mods-release.outputs.new_release_version }}-paper
          name: Bedrock Voice Chat ${{ needs.prepare-mods-release.outputs.new_release_version }} (Paper)
          changelog: ${{ needs.prepare-mods-release.outputs.new_release_notes }}
          loaders: |-
            paper
            spigot
            bukkit
          game-versions: |-
            26.2
          channel: ${{ github.ref_name == 'beta' && 'beta' || 'release' }}

  # Job 16: Publish BDS to CurseForge
  publish-curseforge-bds:
    name: Publish BDS to CurseForge
    needs: [prepare-mods-release, build-mod-bds, approve-publish]
    if: needs.approve-publish.result == 'success' && needs.prepare-mods-release.outputs.new_release_published == 'true' && needs.build-mod-bds.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download BDS artifact (full)
        uses: actions/download-artifact@v5
        with:
          name: bedrock-voice-chat-bds-${{ needs.prepare-mods-release.outputs.new_release_version }}
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      - name: Publish full pack to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project_id: 1445992
          game_endpoint: minecraft
          file_path: ./artifacts/bedrock-voice-chat-${{ needs.prepare-mods-release.outputs.new_release_version }}.mcaddon
          changelog: ${{ needs.prepare-mods-release.outputs.new_release_notes }}
          changelog_type: markdown
          display_name: Bedrock Voice Chat ${{ needs.prepare-mods-release.outputs.new_release_version }}
          game_versions: Bedrock
          release_type: ${{ github.ref_name == 'beta' && 'beta' || 'release' }}

  # Job 17: Publish BDS no-net pack to its own CurseForge project
  publish-curseforge-bds-no-net:
    name: Publish BDS No-Net to CurseForge
    needs: [prepare-mods-release, build-mod-bds, approve-publish]
    if: needs.approve-publish.result == 'success' && needs.prepare-mods-release.outputs.new_release_published == 'true' && needs.build-mod-bds.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download BDS artifact (no-net)
        uses: actions/download-artifact@v5
        with:
          name: bedrock-voice-chat-bds-no-net-${{ needs.prepare-mods-release.outputs.new_release_version }}
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      - name: Publish no-net pack to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project_id: 1644897
          game_endpoint: minecraft
          file_path: ./artifacts/bedrock-voice-chat-no-net-${{ needs.prepare-mods-release.outputs.new_release_version }}.mcaddon
          changelog: ${{ needs.prepare-mods-release.outputs.new_release_notes }}
          changelog_type: markdown
          display_name: Bedrock Voice Chat (Realms + No-Net Servers) ${{ needs.prepare-mods-release.outputs.new_release_version }}
          game_versions: Bedrock
          release_type: ${{ github.ref_name == 'beta' && 'beta' || 'release' }}

  # Job 18: Upload mod artifacts to mods GitHub Release
  upload-mod-release-assets:
    name: Upload Mod Release Assets
    needs: [prepare-mods-release, build-mod-fabric, build-mod-paper, build-mod-bds]
    if: always() && needs.prepare-mods-release.outputs.new_release_published == 'true' && inputs.dry_run == false && (needs.build-mod-fabric.result == 'success' || needs.build-mod-paper.result == 'success' || needs.build-mod-bds.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Fabric artifact
        if: needs.build-mod-fabric.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: bedrock-voice-chat-fabric-${{ needs.prepare-mods-release.outputs.new_release_version }}
          path: ./release-files

      - name: Download Paper artifact
        if: needs.build-mod-paper.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: bedrock-voice-chat-paper-${{ needs.prepare-mods-release.outputs.new_release_version }}
          path: ./release-files

      - name: Download BDS artifact (default)
        if: needs.build-mod-bds.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: bedrock-voice-chat-bds-${{ needs.prepare-mods-release.outputs.new_release_version }}
          path: ./release-files

      - name: Download BDS artifact (no-net)
        if: needs.build-mod-bds.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: bedrock-voice-chat-bds-no-net-${{ needs.prepare-mods-release.outputs.new_release_version }}
          path: ./release-files

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.prepare-mods-release.outputs.new_release_version }}"
          cd ./release-files

          # Rename to consistent naming
          if [ -f "bedrock-voice-chat-${VERSION}.jar" ]; then
            mv "bedrock-voice-chat-${VERSION}.jar" "bvc-fabric-mod-${VERSION}.jar"
          fi

          if [ -f "bedrock-voice-chat-paper-${VERSION}.jar" ]; then
            mv "bedrock-voice-chat-paper-${VERSION}.jar" "bvc-paper-plugin-${VERSION}.jar"
          fi

          if [ -f "bedrock-voice-chat-${VERSION}.mcaddon" ]; then
            mv "bedrock-voice-chat-${VERSION}.mcaddon" "bvc-bds-pack-${VERSION}.mcaddon"
          fi

          if [ -f "bedrock-voice-chat-no-net-${VERSION}.mcaddon" ]; then
            mv "bedrock-voice-chat-no-net-${VERSION}.mcaddon" "bvc-bds-pack-no-net-${VERSION}.mcaddon"
          fi

          echo "=== Release files ==="
          ls -la

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mods-v${{ needs.prepare-mods-release.outputs.new_release_version }}
          files: |
            ./release-files/*.jar
            ./release-files/*.mcaddon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          VERSION="${{ needs.prepare-mods-release.outputs.new_release_version }}"
          {
            echo "## Mods Release Assets Uploaded"
            echo ""
            echo "Version: **mods-v${VERSION}**"
            echo ""
            echo "### Uploaded Files"
            echo ""
            for file in ./release-files/*; do
              if [ -f "$file" ]; then
                echo "- \`$(basename $file)\`"
              fi
            done
          } >> $GITHUB_STEP_SUMMARY

  # Post-approval: Deploy updater manifest to GitHub Pages
  deploy-updater-manifest:
    name: Deploy Updater Manifest
    needs: [prepare-release, approve-publish]
    if: needs.approve-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.new_tag }}

      - name: Download Windows updater artifacts
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: bvc-windows-updater
          path: ./artifacts/windows

      - name: Download macOS updater artifacts
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: bvc-macos-updater
          path: ./artifacts/macos

      - name: Download Linux x86_64 updater artifacts
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: bvc-linux-x86_64-updater
          path: ./artifacts/linux-x86_64

      - name: Download Linux aarch64 updater artifacts
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: bvc-linux-aarch64-updater
          path: ./artifacts/linux-aarch64

      - name: Prepare sig files for script
        run: |
          mkdir -p release-files
          if [ -f "./artifacts/windows/bvc-windows-updater.exe.sig" ]; then
            cp "./artifacts/windows/bvc-windows-updater.exe.sig" "./release-files/bvc-client-windows-x64-updater.exe.sig"
          fi
          if [ -f "./artifacts/macos/bvc-macos-updater.app.tar.gz.sig" ]; then
            cp "./artifacts/macos/bvc-macos-updater.app.tar.gz.sig" "./release-files/bvc-client-macos-arm64-updater.app.tar.gz.sig"
          fi
          if [ -f "./artifacts/linux-x86_64/bvc-client-linux-x86_64.AppImage.sig" ]; then
            cp "./artifacts/linux-x86_64/bvc-client-linux-x86_64.AppImage.sig" "./release-files/bvc-client-linux-x86_64.AppImage.sig"
          fi
          if [ -f "./artifacts/linux-aarch64/bvc-client-linux-aarch64.AppImage.sig" ]; then
            cp "./artifacts/linux-aarch64/bvc-client-linux-aarch64.AppImage.sig" "./release-files/bvc-client-linux-aarch64.AppImage.sig"
          fi

      - name: Generate updater JSON
        env:
          RELEASE_FILES_DIR: ./release-files
        run: |
          VERSION="${{ needs.prepare-release.outputs.new_version }}"
          TAG="${{ needs.prepare-release.outputs.new_tag }}"
          REPO="${{ github.repository }}"
          IS_PRERELEASE="${{ contains(needs.prepare-release.outputs.new_version, '-') }}"

          mkdir -p updater-pages

          if [ "$IS_PRERELEASE" = "true" ]; then
            OUTPUT_PATH=updater-pages/beta.json node .github/scripts/generate-updater-json.js "$VERSION" "$REPO" "$TAG"
          else
            OUTPUT_PATH=updater-pages/latest.json node .github/scripts/generate-updater-json.js "$VERSION" "$REPO" "$TAG"
          fi

          echo "=== Generated updater JSON ==="
          cat updater-pages/*.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./updater-pages
          destination_dir: updater
          keep_files: true

      - name: Updater manifest summary
        run: |
          VERSION="${{ needs.prepare-release.outputs.new_version }}"
          IS_PRERELEASE="${{ contains(needs.prepare-release.outputs.new_version, '-') }}"
          if [ "$IS_PRERELEASE" = "true" ]; then
            FILENAME="beta.json"
          else
            FILENAME="latest.json"
          fi
          {
            echo "## Updater Manifest Deployed"
            echo ""
            echo "| Name | Value |"
            echo "| ---- | ----- |"
            echo "| Version | ${VERSION} |"
            echo "| Manifest | [\`${FILENAME}\`](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/updater/${FILENAME}) |"
            echo "| Channel | $([ "$IS_PRERELEASE" = "true" ] && echo "prerelease" || echo "stable") |"
          } >> $GITHUB_STEP_SUMMARY

  # Post-approval: Deploy versioned AsyncAPI docs to GitHub Pages
  deploy-docs:
    name: Deploy WebSocket Docs (v${{ needs.prepare-release.outputs.new_version }})
    needs: [prepare-release, build-client, approve-publish, deploy-updater-manifest]
    if: always() && needs.approve-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AsyncAPI YAML
        uses: actions/download-artifact@v5
        with:
          name: asyncapi-yaml
          path: docs

      - name: Generate HTML from AsyncAPI spec
        run: npx -y @asyncapi/generator@2 docs/websocket-api.yaml @asyncapi/html-template -o docs/websocket-api-html --force-write -p singleFile=true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/websocket-api-html
          destination_dir: websocket/${{ needs.prepare-release.outputs.new_version }}
          keep_files: true

      - name: Documentation deployed
        run: echo "WebSocket docs deployed to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/websocket/${{ needs.prepare-release.outputs.new_version }}"

  # Post-approval: Deploy versioned OpenAPI docs to GitHub Pages
  deploy-openapi-docs:
    name: Deploy OpenAPI Docs (v${{ needs.prepare-release.outputs.new_version }})
    needs: [prepare-release, build-server, approve-publish, deploy-docs]
    if: always() && needs.approve-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download OpenAPI JSON
        uses: actions/download-artifact@v5
        with:
          name: openapi-json
          path: docs

      - name: Generate Scalar HTML
        run: |
          cat > docs/index.html << 'SCALAR_EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>BVC Server API</title>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
          </head>
          <body>
              <script id="api-reference" data-url="./openapi.json"></script>
              <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
          </body>
          </html>
          SCALAR_EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: api/${{ needs.prepare-release.outputs.new_version }}
          keep_files: true

      - name: Documentation deployed
        run: echo "OpenAPI docs deployed to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/api/${{ needs.prepare-release.outputs.new_version }}"

  # Post-approval: Update version on GitHub Pages landing page (beta only for now)
  update-gh-pages-version:
    name: Update GitHub Pages Version
    needs: [prepare-release, approve-publish, deploy-openapi-docs]
    if: always() && needs.approve-publish.result == 'success' && contains(needs.prepare-release.outputs.new_version, '-beta')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          token: ${{ steps.generate-token.outputs.token }}

      - name: Update version in index.js
        run: |
          VERSION="${{ needs.prepare-release.outputs.new_version }}"
          sed -i "s|const BVC_VERSION = \".*\"|const BVC_VERSION = \"${VERSION}\"|" index.js
          sed -i "s|const BVC_MODS_VERSION = \".*\"|const BVC_MODS_VERSION = \"mods-v${VERSION}\"|" index.js
          echo "Updated index.js:"
          head -3 index.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.js
          git diff --staged --quiet || git commit -m "chore: update version to ${{ needs.prepare-release.outputs.new_version }}"
          git push

  # Post-approval: Build and push Docker image
  publish-docker:
    name: Publish Docker Image
    needs: [prepare-release, build-server, approve-publish]
    if: needs.approve-publish.result == 'success'
    uses: ./.github/workflows/build-server-docker.yml
    with:
      version: ${{ needs.prepare-release.outputs.new_version }}
      ref: ${{ needs.prepare-release.outputs.new_tag }}
      build_mode: release
      push: true
      latest: true
    secrets: inherit

  # Post-approval: Build and push the peering relay image.
  #
  # The registry binaries the image is assembled from. Built on the runner because
  # `common` carries an optional private git dependency that cargo loads while
  # resolving the workspace, which a build container has no credentials for.
  build-relay-binaries:
    name: Build Registry Binaries
    needs: [prepare-release, approve-publish]
    if: needs.approve-publish.result == 'success'
    uses: ./.github/workflows/build-relay.yml
    with:
      build_mode: release
      ref: ${{ needs.prepare-release.outputs.new_tag }}
    secrets: inherit

  # Tagged with the BVC version: the registry's wire protocol moves with BVC, so the
  # version is what tells an operator which registry their servers can enroll with.
  publish-relay-docker:
    name: Publish Relay Image
    needs: [prepare-release, build-relay-binaries]
    if: needs.build-relay-binaries.result == 'success'
    uses: ./.github/workflows/build-relay-docker.yml
    with:
      version: ${{ needs.prepare-release.outputs.new_version }}
      ref: ${{ needs.prepare-release.outputs.new_tag }}
      push: true
      latest: true
    secrets: inherit

  # Post-approval: build the SDK natives and publish the bridge-facing jar.
  #
  # Versioned with BVC because the jar carries the peer wire: a bridge resolving
  # it needs to know which server protocol it speaks, and that is what a BVC
  # version names.
  publish-relay-sdk:
    name: Publish Relay SDK
    needs: [prepare-release, approve-publish]
    if: needs.approve-publish.result == 'success'
    uses: ./.github/workflows/build-relay-sdk.yml
    with:
      version: ${{ needs.prepare-release.outputs.new_version }}
      ref: ${{ needs.prepare-release.outputs.new_tag }}
      publish: true
    secrets: inherit
