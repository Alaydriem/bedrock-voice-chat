name: Build Server

on:
  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode (debug or release)'
        required: false
        default: 'debug'
        type: string
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    name: Build Server (${{ matrix.target }} - ${{ github.event_name == 'pull_request' && 'debug' || startsWith(github.ref, 'refs/tags/') && 'release' || inputs.build_mode || 'debug' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: bvc-server.exe
            build_server: true
            build_native_lib: true

          # Linux x64 builds (musl for static, glibc-free binaries)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: bvc-server-amd64
            build_server: true
            build_native_lib: false  # musl doesn't support cdylib

          # Linux x64 builds (glibc for native library / cdylib)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: bvc-server-amd64-gnu
            build_server: false
            build_native_lib: true

          # Linux arm64 builds (musl for static, glibc-free binaries)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact_name: bvc-server-arm64
            build_server: true
            build_native_lib: false

          # Linux arm64 builds (glibc for native library / cdylib)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: bvc-server-arm64-gnu
            build_server: false
            build_native_lib: true

          # Darwin ARM64 builds (native runner)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: bvc-server-darwin-arm64
            build_server: true
            build_native_lib: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup private cargo deps auth
        uses: ./.github/actions/setup-private-cargo-deps
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./server"
          prefix-key: "v1-rust"

      - name: Install cross (for cross-compilation)
        if: false # Cross-compilation not currently used, but keeping for future
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            build-essential \
            musl-tools \
            musl-dev

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ./server
        run: |
          # Manifest mode: server/vcpkg.json pins the port baseline so PRs
          # don't pick up vcpkg drift on the runner. --x-install-root keeps
          # the classic install layout that libz-sys's vcpkg-rs expects.
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install \
            --triplet x64-windows-static-md \
            --x-install-root="$VCPKG_INSTALLATION_ROOT/installed"
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Force libz-sys/libgit2-sys rebuild on Windows
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ./server
        run: |
          # The rust-cache restore can be a partial match (different Cargo.lock
          # hash) and reuse cached build-script output for libz-sys / libgit2-sys
          # whose emitted lib paths predate this run's vcpkg install. Wipe just
          # those two crates' build dirs so cargo reruns their build scripts
          # against the freshly-installed zlib.
          rm -rf target/*/build/libz-sys-* target/*/build/libgit2-sys-* 2>/dev/null || true
          rm -rf target/*/.fingerprint/libz-sys-* target/*/.fingerprint/libgit2-sys-* 2>/dev/null || true

      - name: Setup cross-compilation environment
        if: false # Cross-compilation not currently used, but keeping for future
        run: |
          # Install cross-compilation toolchain and dependencies
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            pkg-config \
            libssl-dev \
            libasound2-dev

      - name: Verify cross-compilation setup
        if: false # Cross-compilation not currently used, but keeping for future
        run: |
          echo "Cross-compilation environment:"
          echo "OPENSSL_STATIC=${OPENSSL_STATIC:-not set}"
          echo "OPENSSL_VENDORED=${OPENSSL_VENDORED:-not set}"
          echo "PKG_CONFIG_ALLOW_CROSS=${PKG_CONFIG_ALLOW_CROSS:-not set}"
          echo "Available Cross.toml:"
          ls -la Cross.toml || echo "No Cross.toml found"
          echo "Available .cargo/config.toml:"
          ls -la .cargo/config.toml || echo "No .cargo/config.toml found"
          echo "Cross version:"
          cross --version
          echo "Testing aarch64 toolchain:"
          aarch64-linux-gnu-gcc --version || echo "aarch64-linux-gnu-gcc not found"

      - name: Build server (native)
        if: matrix.build_server
        working-directory: ./server
        run: |
          # Determine actual build mode used - force debug for PRs, release for tags
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR detected - building in debug mode"
            cargo build --features bedrock --target ${{ matrix.target }}
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "Tag detected - building in release mode"
            cargo build --release --features bedrock --target ${{ matrix.target }}
          elif [ "${{ inputs.build_mode || 'debug' }}" = "release" ]; then
            echo "Building in release mode"
            cargo build --release --features bedrock --target ${{ matrix.target }}
          else
            echo "Building in debug mode"
            cargo build --features bedrock --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare artifacts
        if: matrix.build_server
        shell: bash
        run: |
          # Determine actual build mode used
          BUILD_MODE="${{ github.event_name == 'pull_request' && 'debug' || startsWith(github.ref, 'refs/tags/') && 'release' || inputs.build_mode || 'debug' }}"
          echo "Effective build mode: $BUILD_MODE"

          if [ "$BUILD_MODE" = "release" ]; then
            BUILD_DIR="server/target/${{ matrix.target }}/release"
          else
            BUILD_DIR="server/target/${{ matrix.target }}/debug"
          fi

          if [ "${{ runner.os }}" = "Windows" ]; then
            FINAL_NAME="bvc-server-${{ matrix.target }}-$BUILD_MODE.exe"
            cp "${BUILD_DIR}/bvc-server.exe" "$FINAL_NAME"
          else
            FINAL_NAME="bvc-server-${{ matrix.target }}-$BUILD_MODE"
            cp "${BUILD_DIR}/bvc-server" "$FINAL_NAME"
          fi

          echo "Created artifact: $FINAL_NAME"
          ls -la "$FINAL_NAME"

      - name: Upload artifacts
        if: matrix.build_server
        uses: actions/upload-artifact@v5
        id: upload-server
        with:
          name: bvc-server-${{ matrix.target }}-${{ github.event_name == 'pull_request' && 'debug' || startsWith(github.ref, 'refs/tags/') && 'release' || inputs.build_mode || 'debug' }}
          path: bvc-server-${{ matrix.target }}-${{ github.event_name == 'pull_request' && 'debug' || startsWith(github.ref, 'refs/tags/') && 'release' || inputs.build_mode || 'debug' }}${{ runner.os == 'Windows' && '.exe' || '' }}
          retention-days: 30

      - name: Output artifact information
        if: matrix.build_server
        shell: bash
        run: |
          BUILD_MODE="${{ github.event_name == 'pull_request' && 'debug' || startsWith(github.ref, 'refs/tags/') && 'release' || inputs.build_mode || 'debug' }}"
          {
            echo "## Server Build Complete"
            echo ""
            echo "| Name | Value |"
            echo "| ---- | ----- |"
            echo "| Target | ${{ matrix.target }} |"
            echo "| Build Mode | $BUILD_MODE |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Artifact | bvc-server-${{ matrix.target }}-$BUILD_MODE |"
            echo "| Artifact URL | [View Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Retention | 30 days |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Determine library name
        if: matrix.build_native_lib
        id: lib-name
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "lib_name=bvc_server_lib.dll" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "lib_name=libbvc_server_lib.dylib" >> $GITHUB_OUTPUT
          else
            echo "lib_name=libbvc_server_lib.so" >> $GITHUB_OUTPUT
          fi

      - name: Build native library
        if: matrix.build_native_lib
        working-directory: ./server
        shell: bash
        run: |
          BUILD_MODE="${{ github.event_name == 'pull_request' && 'debug' || startsWith(github.ref, 'refs/tags/') && 'release' || inputs.build_mode || 'debug' }}"
          if [ "$BUILD_MODE" = "release" ]; then
            cargo build --lib --release --features bedrock --target ${{ matrix.target }}
          else
            cargo build --lib --features bedrock --target ${{ matrix.target }}
          fi

      - name: Verify native library exists
        if: matrix.build_native_lib
        shell: bash
        run: |
          BUILD_MODE="${{ github.event_name == 'pull_request' && 'debug' || startsWith(github.ref, 'refs/tags/') && 'release' || inputs.build_mode || 'debug' }}"
          echo "Looking for library in: server/target/${{ matrix.target }}/$BUILD_MODE/"
          ls -la server/target/${{ matrix.target }}/$BUILD_MODE/ || true
          ls -la server/target/${{ matrix.target }}/$BUILD_MODE/*.so 2>/dev/null || echo "No .so files found"
          ls -la server/target/${{ matrix.target }}/$BUILD_MODE/*.dylib 2>/dev/null || echo "No .dylib files found"
          ls -la server/target/${{ matrix.target }}/$BUILD_MODE/*.dll 2>/dev/null || echo "No .dll files found"

      - name: Upload native library artifact
        if: matrix.build_native_lib
        uses: actions/upload-artifact@v5
        with:
          name: bvc-native-lib-${{ matrix.target }}
          path: server/target/${{ matrix.target }}/${{ github.event_name == 'pull_request' && 'debug' || startsWith(github.ref, 'refs/tags/') && 'release' || inputs.build_mode || 'debug' }}/${{ steps.lib-name.outputs.lib_name }}
          if-no-files-found: error
          retention-days: 30

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup private cargo deps auth
        uses: ./.github/actions/setup-private-cargo-deps
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./server"
          # Distinct cache key so test caches don't collide with build caches.
          key: test

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            build-essential \
            libasound2-dev

      - name: Run workspace tests
        working-directory: ./server
        # --tests scopes compilation to test/lib/bin targets and skips examples
        # (an unrelated example on beta currently fails to compile).
        # --test-threads=1 keeps the integration suite serial: each test binds
        # 127.0.0.1:0 then hands the port to Rocket; we'd rather pay time than
        # chase a TOCTOU port collision.
        run: cargo test --workspace --tests --locked -- --test-threads=1

  generate-openapi-spec:
    name: Generate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup private cargo deps auth
        uses: ./.github/actions/setup-private-cargo-deps
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./server"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            build-essential \
            libasound2-dev

      - name: Generate OpenAPI spec
        working-directory: ./server/server
        run: |
          mkdir -p ../../docs
          cargo run --example openapi_spec > ../../docs/openapi.json
          echo "Generated OpenAPI spec:"
          head -20 ../../docs/openapi.json

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v5
        with:
          name: openapi-json
          path: docs/openapi.json
          retention-days: 30
