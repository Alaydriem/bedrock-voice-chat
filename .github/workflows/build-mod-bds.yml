name: Build BDS Pack

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build (overrides package.json)'
        required: false
        type: string
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bds-pack:
    name: Build BDS Addon Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Patch version files
        if: inputs.version != ''
        run: |
          node .github/scripts/patch-mod-versions.js "${{ inputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Enable Corepack for Yarn
        run: corepack enable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            mods/bds/node_modules
            ~/.yarn/berry/cache
          key: ${{ runner.os }}-bds-${{ hashFiles('mods/bds/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-bds-

      - name: Install dependencies
        working-directory: ./mods/bds
        run: yarn install --immutable

      - name: Get pack version
        id: pack-version
        working-directory: ./mods/bds
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Pack version: $VERSION"

      - name: Bundle zip
        working-directory: ./mods/bds
        run: yarn run pack

      - name: Verify mcaddon creation
        shell: bash
        run: |
          cd mods/bds
          VERSION="${{ steps.pack-version.outputs.version }}"

          FULL_SRC="bedrock-voice-chat.mcaddon"
          NO_NET_SRC="bedrock-voice-chat-no-net.mcaddon"

          if [ ! -f "$FULL_SRC" ]; then
            echo "Default mcaddon ($FULL_SRC) not produced!"
            exit 1
          fi
          if [ ! -f "$NO_NET_SRC" ]; then
            echo "No-net mcaddon ($NO_NET_SRC) not produced!"
            exit 1
          fi

          cp "$FULL_SRC" "../../bedrock-voice-chat-${VERSION}.mcaddon"
          cp "$NO_NET_SRC" "../../bedrock-voice-chat-no-net-${VERSION}.mcaddon"

          echo "Prepared artifacts:"
          ls -lh "../../bedrock-voice-chat-${VERSION}.mcaddon" "../../bedrock-voice-chat-no-net-${VERSION}.mcaddon"

      - name: Upload default mcaddon artifact
        uses: actions/upload-artifact@v5
        with:
          name: bedrock-voice-chat-bds-${{ steps.pack-version.outputs.version }}
          path: bedrock-voice-chat-${{ steps.pack-version.outputs.version }}.mcaddon
          retention-days: 30

      - name: Upload no-net mcaddon artifact
        uses: actions/upload-artifact@v5
        with:
          name: bedrock-voice-chat-bds-no-net-${{ steps.pack-version.outputs.version }}
          path: bedrock-voice-chat-no-net-${{ steps.pack-version.outputs.version }}.mcaddon
          retention-days: 30

      - name: Output artifact information
        shell: bash
        run: |
          {
            echo "## BDS Pack Build Complete"
            echo ""
            echo "| Name | Value |"
            echo "| ---- | ----- |"
            echo "| Version | ${{ steps.pack-version.outputs.version }} |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Default artifact | bedrock-voice-chat-bds-${{ steps.pack-version.outputs.version }}.mcaddon |"
            echo "| No-net artifact  | bedrock-voice-chat-bds-no-net-${{ steps.pack-version.outputs.version }}.mcaddon |"
            echo "| Artifact URL | [View Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Retention | 30 days |"
          } >> $GITHUB_STEP_SUMMARY
