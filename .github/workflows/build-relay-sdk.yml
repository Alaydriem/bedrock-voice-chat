name: Build Relay SDK

on:
  workflow_call:
    inputs:
      version:
        description: 'Version for the published artifact'
        required: true
        type: string
      publish:
        description: 'Publish the jar to GitHub Packages'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string
      publish:
        description: 'Publish the jar to GitHub Packages'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

# The cdylibs come from build-relay-sdk-natives.yml, which the caller runs at the
# same tier as build-server.yml. They are built before the mod jars because the
# mods hash them into native-manifest.json; this job only packages them.
jobs:
  publish:
    name: Package and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # The bindings are checked in, so this job needs no Rust toolchain — only
      # the natives workflow does.
      - name: Download every native
        uses: actions/download-artifact@v5
        with:
          pattern: relay-sdk-native-*
          path: mods/java/relay-sdk/src/main/resources
          merge-multiple: true

      - name: Show what will be packaged
        run: find mods/java/relay-sdk/src/main/resources -type f -ls

      - name: Set the artifact version
        working-directory: mods/java
        run: |
          set -euo pipefail
          sed -i "s/^modVersion=.*/modVersion=${{ inputs.version }}/" gradle.properties
          grep '^modVersion=' gradle.properties

      - name: Build the jar
        working-directory: mods/java
        run: |
          chmod +x gradlew
          ./gradlew :relay-sdk:shadowJar --no-daemon

      # Reported rather than assumed: `relocate` silently does nothing when the
      # dependency is not bundled the way the config expects, and the failure
      # only surfaces when a second plugin loads on a real server.
      - name: Verify JNA is relocated
        working-directory: mods/java
        run: |
          set -euo pipefail
          jar=$(ls relay-sdk/build/libs/*.jar | head -1)
          echo "inspecting $jar"
          if unzip -l "$jar" | grep -q ' com/sun/jna/'; then
            echo "unrelocated JNA classes are present; the relocation did not apply"
            exit 1
          fi
          unzip -l "$jar" | grep -c 'com/alaydriem/bedrockvoicechat/shaded/jna/'

      - name: Publish to GitHub Packages
        if: ${{ inputs.publish }}
        working-directory: mods/java
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :relay-sdk:publishRelaySdkPublicationToGitHubPackagesRepository --no-daemon

      - name: Summary
        run: |
          {
            echo "## Relay SDK Published"
            echo ""
            echo "| Name | Value |"
            echo "| ---- | ----- |"
            echo "| Artifact | com.alaydriem:bedrock-voice-chat-relay-sdk |"
            echo "| Version | ${{ inputs.version }} |"
            echo "| Platforms | windows-x64, linux-x64, linux-arm64, darwin-arm64 |"
            echo "| Published | ${{ inputs.publish }} |"
          } >> $GITHUB_STEP_SUMMARY
