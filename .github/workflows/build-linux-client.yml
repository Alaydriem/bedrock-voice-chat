name: Build Linux Client
permissions:
  contents: write

on:
  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode (debug or release)'
        required: false
        default: 'debug'
        type: string
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
      version:
        description: 'Version to patch into config files (ensures correct version during dry-run)'
        required: false
        default: ''
        type: string
      build_number:
        description: 'Atomic build number from Redis'
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      variant:
        description: 'Version channel for the display version'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - rc
          - stable
      variant_iteration:
        description: 'Prerelease number N (blank = derive from current repo version)'
        required: false
        default: ''
        type: string

jobs:
  build-linux:
    name: Build Linux Client (${{ matrix.arch }}, ${{ github.event_name == 'pull_request' && 'debug' || inputs.build_mode || 'debug' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Compose manual variant version
        id: manualver
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CORE=$(grep '^version' client/src-tauri/Cargo.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+).*"/\1/')
          CURPRE=$(grep '^version' client/src-tauri/Cargo.toml | head -1 | sed -E 's/.*-(alpha|internal|beta|rc)\.?([0-9]+).*/\2/')
          N="${{ inputs.variant_iteration }}"
          if [ -z "$N" ]; then N="$CURPRE"; fi
          if ! echo "$N" | grep -qE '^[0-9]+$'; then N=1; fi
          VARIANT="${{ inputs.variant }}"
          if [ "$VARIANT" = "stable" ]; then
            COMPOSED="$CORE"
          else
            COMPOSED="$CORE-$VARIANT.$N"
          fi
          echo "Composed manual version: $COMPOSED"
          echo "version=$COMPOSED" >> "$GITHUB_OUTPUT"

      - name: Patch version files
        if: inputs.version != '' || steps.manualver.outputs.version != ''
        shell: bash
        run: |
          node .github/scripts/patch-versions.js "${{ inputs.version != '' && inputs.version || steps.manualver.outputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup private cargo deps auth
        uses: ./.github/actions/setup-private-cargo-deps
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          key: ${{ matrix.arch }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install JavaScript dependencies
        working-directory: ./client
        run: yarn install --frozen-lockfile

      - name: Write client environment file
        shell: bash
        run: |
          cat > client/.env.local << 'ENVEOF'
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          FLAGSMITH_KEY=${{ secrets.FLAGSMITH_KEY }}
          FLAGSMITH_SERVER=${{ secrets.FLAGSMITH_SERVER }}
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_REDIRECT_URI=${{ secrets.DISCORD_REDIRECT_URI }}
          APP_BUILD_NUMBER=${{ inputs.build_number }}
          ENVEOF

      - name: Build Linux client (debug)
        if: github.event_name == 'pull_request' || inputs.build_mode == 'debug' || inputs.build_mode == '' || inputs.build_mode == null
        working-directory: ./client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tauri build --debug --no-bundle

      - name: Build Linux client (release)
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release'
        working-directory: ./client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # appimagetool needs libfuse2 or extraction fallback; CI runners lack a
          # mounted FUSE device, so force the extract-and-run path.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: yarn tauri build

      - name: Prepare Linux artifacts
        working-directory: ./client
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BUILD_MODE=debug
          elif [ "${{ inputs.build_mode }}" = "release" ]; then
            BUILD_MODE=release
          else
            BUILD_MODE=debug
          fi
          echo "Effective build mode: $BUILD_MODE"
          ARCH="${{ matrix.arch }}"

          BIN="../target/$BUILD_MODE/bedrock-voice-chat-client"
          if [ -f "$BIN" ]; then
            cp "$BIN" "bvc-linux-$ARCH-$BUILD_MODE"
            echo "Copied $BUILD_MODE binary"
          else
            echo "ERROR: binary not found at $BIN"
            exit 1
          fi

          if [ "$BUILD_MODE" = "release" ]; then
            BUNDLE_DIR="../target/release/bundle"

            APPIMAGE=$(find "$BUNDLE_DIR/appimage" -maxdepth 1 -name '*.AppImage' | head -1)
            if [ -n "$APPIMAGE" ]; then
              cp "$APPIMAGE" "bvc-client-linux-$ARCH.AppImage"
              echo "Copied AppImage: $(basename "$APPIMAGE")"
            else
              echo "ERROR: AppImage not found in $BUNDLE_DIR/appimage"
              exit 1
            fi

            APPIMAGE_SIG=$(find "$BUNDLE_DIR/appimage" -maxdepth 1 -name '*.AppImage.sig' | head -1)
            if [ -n "$APPIMAGE_SIG" ]; then
              cp "$APPIMAGE_SIG" "bvc-client-linux-$ARCH.AppImage.sig"
              echo "Copied AppImage signature"
            else
              echo "WARNING: AppImage signature not found (updater will be skipped for this arch)"
            fi

            DEB=$(find "$BUNDLE_DIR/deb" -maxdepth 1 -name '*.deb' | head -1)
            if [ -n "$DEB" ]; then
              cp "$DEB" "bvc-client-linux-$ARCH.deb"
              echo "Copied deb: $(basename "$DEB")"
            else
              echo "ERROR: deb not found in $BUNDLE_DIR/deb"
              exit 1
            fi
          fi

      - name: Upload Linux binary
        uses: actions/upload-artifact@v5
        with:
          name: bvc-linux-${{ matrix.arch }}-${{ github.event_name == 'pull_request' && 'debug' || inputs.build_mode || 'debug' }}
          path: client/bvc-linux-${{ matrix.arch }}-${{ github.event_name == 'pull_request' && 'debug' || inputs.build_mode || 'debug' }}
          retention-days: 30

      - name: Upload Linux AppImage
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: bvc-linux-${{ matrix.arch }}-appimage
          path: client/bvc-client-linux-${{ matrix.arch }}.AppImage
          retention-days: 90
          if-no-files-found: error

      - name: Upload Linux deb
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: bvc-linux-${{ matrix.arch }}-deb
          path: client/bvc-client-linux-${{ matrix.arch }}.deb
          retention-days: 90
          if-no-files-found: error

      - name: Upload Linux updater artifacts
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: bvc-linux-${{ matrix.arch }}-updater
          path: |
            client/bvc-client-linux-${{ matrix.arch }}.AppImage
            client/bvc-client-linux-${{ matrix.arch }}.AppImage.sig
          retention-days: 90
          if-no-files-found: warn

      - name: Output artifact information
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BUILD_MODE=debug
          elif [ "${{ inputs.build_mode }}" = "release" ]; then
            BUILD_MODE=release
          else
            BUILD_MODE=debug
          fi
          {
            echo "## Linux Client Build Complete (${{ matrix.arch }})"
            echo ""
            echo "| Name | Value |"
            echo "| ---- | ----- |"
            echo "| Architecture | ${{ matrix.arch }} |"
            echo "| Build Mode | $BUILD_MODE |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Runner | ${{ matrix.runner }} |"
          } >> "$GITHUB_STEP_SUMMARY"
