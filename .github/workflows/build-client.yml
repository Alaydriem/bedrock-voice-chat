name: Build Windows Client
permissions:
  contents: write

on:
  workflow_call:
    inputs:
      build_mode:
        description: 'Build mode (debug or release)'
        required: false
        default: 'debug'
        type: string
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
      version:
        description: 'Version to patch into config files (ensures correct version during dry-run)'
        required: false
        default: ''
        type: string
      build_number:
        description: 'Atomic build number from Redis'
        required: false
        default: ''
        type: string
      store_release:
        description: 'Official Microsoft Store release: pin the MSIX 4th version part to 0. Non-store builds draw an incremental revision.'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      variant:
        description: 'Version channel for the MSIX/display version'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - rc
          - stable
      variant_iteration:
        description: 'Prerelease number N (blank = derive from current repo version)'
        required: false
        default: ''
        type: string

jobs:
  build-windows:
    name: Build Windows Client (${{ github.event_name == 'pull_request' && 'debug' || inputs.build_mode || 'debug' }})
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Compose manual variant version
        id: manualver
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CORE=$(grep '^version' client/src-tauri/Cargo.toml | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+).*"/\1/')
          CURPRE=$(grep '^version' client/src-tauri/Cargo.toml | head -1 | sed -E 's/.*-(alpha|internal|beta|rc)\.?([0-9]+).*/\2/')
          N="${{ inputs.variant_iteration }}"
          if [ -z "$N" ]; then N="$CURPRE"; fi
          if ! echo "$N" | grep -qE '^[0-9]+$'; then N=1; fi
          VARIANT="${{ inputs.variant }}"
          if [ "$VARIANT" = "stable" ]; then
            COMPOSED="$CORE"
          else
            COMPOSED="$CORE-$VARIANT.$N"
          fi
          echo "Composed manual version: $COMPOSED"
          echo "version=$COMPOSED" >> "$GITHUB_OUTPUT"

      - name: Patch version files
        if: inputs.version != '' || steps.manualver.outputs.version != ''
        shell: bash
        run: |
          node .github/scripts/patch-versions.js "${{ inputs.version != '' && inputs.version || steps.manualver.outputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: client/yarn.lock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup private cargo deps auth
        uses: ./.github/actions/setup-private-cargo-deps
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install JavaScript dependencies
        working-directory: ./client
        run: yarn install --frozen-lockfile

      - name: Download and setup ASIO SDK
        working-directory: ./client/src-tauri
        shell: powershell
        run: |
          Write-Host "Downloading ASIO SDK..."
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile "asiosdk.zip"
          Expand-Archive -Path "asiosdk.zip" -DestinationPath "." -Force
          Get-ChildItem -Path "." -Name
          Write-Host "ASIO SDK downloaded and extracted"

      - name: Set up LIBCLANG environment
        shell: powershell
        run: |
          # Set LIBCLANG_PATH to Visual Studio Community 2022 LLVM lib directory
          $libclangPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\lib"
          if (-not (Test-Path $libclangPath)) {
            $libclangPath = "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Tools\Llvm\x64\lib"
          }
          if (-not (Test-Path $libclangPath)) {
            $libclangPath = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\lib"
          }
          if (-not (Test-Path $libclangPath)) {
            Write-Host "Warning: Could not find Visual Studio LLVM lib directory, using default"
            $libclangPath = "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\lib"
          }

          Write-Host "Setting LIBCLANG_PATH to: $libclangPath"
          echo "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV

      - name: Write client environment file
        shell: bash
        run: |
          cat > client/.env.local << 'ENVEOF'
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          FLAGSMITH_KEY=${{ secrets.FLAGSMITH_KEY }}
          FLAGSMITH_SERVER=${{ secrets.FLAGSMITH_SERVER }}
          APP_BUILD_NUMBER=${{ inputs.build_number }}
          ENVEOF

      - name: Build Windows client (debug)
        if: github.event_name == 'pull_request' || inputs.build_mode == 'debug' || inputs.build_mode == '' || inputs.build_mode == null
        working-directory: ./client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tauri build --debug --no-bundle

      - name: Build Windows client (release)
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release'
        working-directory: ./client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tauri build

      - name: Prepare Windows artifacts
        working-directory: ./client
        shell: powershell
        run: |
          # Determine actual build mode used
          if ("${{ github.event_name }}" -eq "pull_request") {
            $BUILD_MODE = "debug"
          } elseif ("${{ inputs.build_mode }}" -eq "release") {
            $BUILD_MODE = "release"
          } else {
            $BUILD_MODE = "debug"
          }
          Write-Host "Effective build mode: $BUILD_MODE" -ForegroundColor Cyan

          if ($BUILD_MODE -eq "release") {
            # Copy release executable
            if (Test-Path "..\target\release\bedrock-voice-chat-client.exe") {
              Copy-Item "..\target\release\bedrock-voice-chat-client.exe" "bvc-windows-$BUILD_MODE.exe"
              Write-Host "Copied release executable" -ForegroundColor Green
            } else {
              Write-Host "ERROR: Release executable not found!" -ForegroundColor Red
              exit 1
            }
          } else {
            # Copy debug executable
            if (Test-Path "..\target\debug\bedrock-voice-chat-client.exe") {
              Copy-Item "..\target\debug\bedrock-voice-chat-client.exe" "bvc-windows-$BUILD_MODE.exe"
              Write-Host "Copied debug executable" -ForegroundColor Green
            } else {
              Write-Host "ERROR: Debug executable not found!" -ForegroundColor Red
              exit 1
            }
          }

          # Verify the final executable
          if (Test-Path "bvc-windows-$BUILD_MODE.exe") {
            Write-Host "Final executable ready:" -ForegroundColor Green
            Get-ChildItem "bvc-windows-$BUILD_MODE.exe" | Format-List Name, Length, LastWriteTime
          }

          # Copy NSIS updater artifacts (release builds only)
          if ($BUILD_MODE -eq "release") {
            $nsisDir = "..\target\release\bundle\nsis"
            if (Test-Path $nsisDir) {
              Write-Host "Found NSIS bundle directory:" -ForegroundColor Cyan
              Get-ChildItem $nsisDir | ForEach-Object {
                Write-Host "  $($_.Name)" -ForegroundColor Cyan
              }

              $nsisExe = Get-ChildItem "$nsisDir\*-setup.exe" | Select-Object -First 1
              if ($nsisExe) {
                Copy-Item $nsisExe.FullName "bvc-windows-nsis-setup.exe"
                Write-Host "Copied NSIS installer: $($nsisExe.Name)" -ForegroundColor Green
              }

              # Tauri 2 generates updater artifacts as .exe + .exe.sig (not .nsis.zip)
              $updaterExe = Get-ChildItem "$nsisDir\*-setup.exe" | Select-Object -First 1
              $updaterSig = Get-ChildItem "$nsisDir\*-setup.exe.sig" | Select-Object -First 1
              if ($updaterExe) {
                Copy-Item $updaterExe.FullName "bvc-windows-updater.exe"
                Write-Host "Copied updater exe: $($updaterExe.Name)" -ForegroundColor Green
              }
              if ($updaterSig) {
                Copy-Item $updaterSig.FullName "bvc-windows-updater.exe.sig"
                Write-Host "Copied updater signature: $($updaterSig.Name)" -ForegroundColor Green
              }
            } else {
              Write-Host "WARNING: NSIS bundle directory not found at $nsisDir" -ForegroundColor Yellow
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        id: upload-windows
        with:
          name: bvc-windows-${{ github.event_name == 'pull_request' && 'debug' || inputs.build_mode || 'debug' }}
          path: client/bvc-windows-${{ github.event_name == 'pull_request' && 'debug' || inputs.build_mode || 'debug' }}.exe
          retention-days: 30

      - name: Upload Windows NSIS installer
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: bvc-windows-nsis-setup
          path: client/bvc-windows-nsis-setup.exe
          retention-days: 90
          if-no-files-found: error

      - name: Compute MSIX revision key (non-store release only)
        id: msixrev
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release' && inputs.store_release != true
        shell: bash
        run: |
          VERSION=$(node -pe "require('./client/src-tauri/tauri.conf.json').version")
          NUMERIC="${VERSION%%-*}"
          echo "key=windows-build-number-$NUMERIC" >> "$GITHUB_OUTPUT"
          echo "MSIX counter key: windows-build-number-$NUMERIC (from $VERSION)"

      - name: Get Windows MSIX build number (non-store release only)
        id: msixbuild
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release' && inputs.store_release != true
        uses: ./.github/actions/get-build-number
        with:
          redis_url: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          redis_token: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          key: ${{ steps.msixrev.outputs.key }}
          record_ledger: 'false'

      - name: Build MSIX package (release only)
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release'
        working-directory: ./client
        shell: powershell
        run: |
          $rev = "${{ steps.msixbuild.outputs.build_number }}"
          # Store releases skip the counter step, leaving this empty -> pinned to 0.
          if (-not $rev) { $rev = "0" }
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($version -match '^\d+\.\d+\.\d+$') {
            $msixVersion = "$version.$rev"
          } else {
            # semver with pre-release suffix (e.g. 1.0.510-beta.11) — MSIX requires 4-part numeric.
            # Strip the suffix; Store cares about the numeric ordering, not the channel label.
            $numeric = ($version -split '-')[0]
            $msixVersion = "$numeric.$rev"
          }
          Write-Host "Packaging MSIX at version $msixVersion (from $version)"

          $stage = "msix-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          New-Item -ItemType Directory -Path "$stage/Assets" | Out-Null

          $exeSource = "..\target\release\bedrock-voice-chat-client.exe"
          if (-not (Test-Path $exeSource)) {
            Write-Host "ERROR: Tauri release binary not found at $exeSource" -ForegroundColor Red
            exit 1
          }
          Copy-Item $exeSource "$stage/bedrock-voice-chat-client.exe"

          Copy-Item "src-tauri/icons/Square44x44Logo.png"  "$stage/Assets/Square44x44Logo.png"
          Copy-Item "src-tauri/icons/Square150x150Logo.png" "$stage/Assets/Square150x150Logo.png"
          Copy-Item "src-tauri/icons/StoreLogo.png"        "$stage/Assets/StoreLogo.png"

          $manifest = Get-Content "src-tauri/msix/AppxManifest.xml" -Raw
          $manifest = $manifest.Replace("__VERSION_4PART__", $msixVersion)
          Set-Content -Path "$stage/AppxManifest.xml" -Value $manifest -Encoding UTF8

          $makeAppx = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
                       Sort-Object FullName | Select-Object -Last 1).FullName
          if (-not $makeAppx) {
            Write-Host "ERROR: makeappx.exe not found in Windows 10 SDK" -ForegroundColor Red
            exit 1
          }
          Write-Host "Using $makeAppx"

          & $makeAppx pack /d $stage /p "bvc-client-windows-x64.msix" /o
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: MakeAppx failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit 1
          }

          if (Test-Path "bvc-client-windows-x64.msix") {
            Get-Item "bvc-client-windows-x64.msix" | Format-List Name, Length, LastWriteTime
          }

      - name: Upload Windows MSIX
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: bvc-windows-msix
          path: client/bvc-client-windows-x64.msix
          retention-days: 90
          if-no-files-found: error

      - name: Upload Windows updater artifacts
        if: github.event_name != 'pull_request' && inputs.build_mode == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: bvc-windows-updater
          path: |
            client/bvc-windows-updater.exe
            client/bvc-windows-updater.exe.sig
          retention-days: 90
          if-no-files-found: warn

      - name: Output artifact information
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $BUILD_MODE = "debug"
          } elseif ("${{ inputs.build_mode }}" -eq "release") {
            $BUILD_MODE = "release"
          } else {
            $BUILD_MODE = "debug"
          }
          $summary = @"
          ## Windows Client Build Complete

          | Name | Value |
          | ---- | ----- |
          | Build Mode | $BUILD_MODE |
          | Trigger | ${{ github.event_name }} |
          | Artifact | bvc-windows-$BUILD_MODE.exe |
          | Artifact URL | [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | Retention | 30 days |
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Generate AsyncAPI YAML
        working-directory: ./client
        run: yarn asyncapi-docs

      - name: Upload AsyncAPI YAML
        uses: actions/upload-artifact@v5
        with:
          name: asyncapi-yaml
          path: docs/websocket-api.yaml
          retention-days: 1
