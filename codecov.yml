# Coverage here is REPORTED, never gated.
#
# CLAUDE.md §10 bans zero-value tests — serialization round-trips, DTO
# construction, encoding round-trips, enum discriminant assertions. Those are
# precisely the constructs that dominate the DTO-heavy modules in common/, so a
# low absolute number there is the policy working, not a defect. A project
# threshold would create pressure to write the exact tests that policy forbids.
#
# The signal we act on is patch coverage: of the lines this PR changed, how many
# does a test execute. It stays informational so it can never block a merge.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  # diff  -> the patch-coverage summary: of the lines this PR touched, how many
  #          are executed by a test. This is the number to read first.
  # flags -> per-area rollup. The flags map 1:1 onto
  #          common/server/client/frontend, so this answers "which area did this
  #          PR move" without a second tool. (Codecov "Components" would
  #          duplicate this; flags already align.)
  # files -> the per-changed-file table — which specific files need tests.
  layout: "condensed_header, diff, flags, files, condensed_footer"
  behavior: default
  require_changes: false
  # Five uploads per commit: common, server, client, frontend, e2e. Codecov's
  # default is to post and rewrite the comment after EACH one, so the first
  # version appears ~90s into a ~40min pipeline holding only `common` — which is
  # almost entirely ts-rs export_bindings tests, and reads as "coverage is
  # broken". Waiting for all five means the number is right the first time it is
  # shown.
  #
  # Keep this in sync with the number of Codecov uploads in tests.yml. Set it
  # higher than the number of uploads and the comment stops appearing at all.
  after_n_builds: 5

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: common
      paths:
        - common/
    - name: server
      paths:
        - server/
    # The client is two codebases behind one directory, measured by two different
    # tools. Splitting them keeps the flags non-overlapping, so the rollup answers
    # "Rust or TypeScript" rather than counting the same PR twice.
    - name: client
      paths:
        - client/src-tauri/
    - name: frontend
      paths:
        - client/src/
    # Deliberately unfiltered. One e2e run drives the client crate, the server
    # crate (through a dlopen'd cdylib) and common together, so any path list
    # here would either drop real coverage or overlap the flags above and make
    # the rollup answer "which area did this PR move" twice. Codecov unions line
    # hits across uploads for a commit, so a line this flag covers and `client`
    # does not is counted once, not twice.
    - name: e2e

ignore:
  # ts-rs generated from the Rust types in common/; the generator is what is
  # under test, not the output.
  - client/src/js/bindings/**
  - "**/tests/**"
  # Vitest harness and the SvelteKit module stubs it needs.
  - client/src/test/**
  # The reference gallery: design sources built to dist-radial, never shipped in
  # the app. They are the spec the app is checked against, not app code.
  - client/src/radial/examples/**
