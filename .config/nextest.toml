# nextest runs every test in its own process, which is what makes the e2e suite
# robust: the client harness loads the server cdylib via FFI and boots in-process
# server runtimes, and a single long-lived `cargo test` process accumulates native
# state across tests until it faults (STATUS_ACCESS_VIOLATION). Process-per-test
# isolates each one, so that accumulation never happens.
#
# Global concurrency is the `--test-threads` / `-j` lever, set per-environment
# (a CI runner has far less headroom than a dev workstation) rather than pinned
# here. The groups below bound only the heaviest tests on top of that lever.

[test-groups]
# The cross-server voice/jukebox scenarios each boot 2-3 in-process server
# runtimes plus up to 3 client procs — by far the heaviest tests. The FFI runtime
# is now thread-bounded (server/server/src/ffi/mod.rs), which fixed the hard
# crash and lets these run concurrently; but several at once is still enough load
# to exhaust a small machine, so they are capped at 2 concurrent. Everything else
# parallelizes up to `-j`. Raise this only with headroom to spare.
heavy-relay-e2e = { max-threads = 2 }

# Scenarios that put a UDP relay between a client and the server, so every datagram
# takes an extra userspace hop through a tokio task.
#
# These matter for a reason beyond their own cost. Several audio scenarios assert
# *exact* frame delivery — "Alice sent 150, Bob received 150" — over bounded
# channels, which is only true while the machine keeps up. Adding relay scenarios
# raised full-suite load enough that those equalities began failing by one frame,
# on a different test each run. Capping the relay group keeps that headroom.
relayed-e2e = { max-threads = 1 }

[profile.default]
# Per test, not per run: a test is flagged slow after `period`, and killed after
# `period * terminate-after`. nextest's default only warns and never terminates,
# so a single deadlocked test blocks the whole run indefinitely — and with
# `--no-fail-fast` it does so silently, having already printed nothing. This
# turns that into a reported TIMEOUT instead of a stall.
#
# Sized against observed durations: every non-relay scenario finishes under 25s,
# so 60s flags something genuinely unusual and 180s is ~7x the slowest. Relay
# scenarios get their own, longer bound below.
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(/scenarios::relay_/)'
test-group = 'heavy-relay-e2e'
# `relay_dropped_link_reconnects_and_audio_resumes` legitimately takes ~52s: it
# drops a peer link and waits for the reconnect to re-establish. The rest of the
# relay set runs 25-33s. 120s therefore still means "unexpected", and 360s keeps
# ~7x headroom so a contended machine cannot manufacture a false TIMEOUT — this
# suite is load-sensitive enough to produce spurious failures under parallel
# builds.
slow-timeout = { period = "120s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(/scenarios::downlink_loss::/) + test(/scenarios::link_stall::/) + test(/scenarios::path_exhaustion::/)'
test-group = 'relayed-e2e'
