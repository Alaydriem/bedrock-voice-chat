[package]
name = "bvc-relay-sdk"
version = "0.1.0"
edition = "2024"
publish = false

# Tests live in tests/ mirroring src/, wired through a single aggregator target.
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

# `lib` alongside `cdylib`: the cdylib is what the JVM loads, and the lib is what
# this crate's own tests link against. A cdylib-only crate cannot be tested from
# tests/.
[lib]
name = "bvc_relay_sdk"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Off by default. `uniffi/cli` is what provides the bindgen binary, and it pulls
# the whole code generator with it — askama, goblin, cargo_metadata and their
# trees. Only the Gradle `generateBindings` task needs it, so a crate that merely
# links this one to call it does not build a code generator to do so.
bindgen = ["uniffi/cli"]

[dependencies]
bvc-relay = { path = "../lib" }
common = { path = "../../common", default-features = false }
thiserror = { version = "^2" }
tokio = { version = "^1", features = ["full"] }
tracing = { version = "^0.1" }
# `tokio` is what makes `async_runtime = "tokio"` available on an exported impl.
# It does not imply `cli`, which the `bindgen` feature adds separately.
uniffi = { version = "0.32.0", features = ["tokio"] }
