[package]
name = "bvc-relay"
version = "0.1.0"
edition = "2024"
publish = false

# Tests live in tests/ mirroring src/, wired through a single aggregator target.
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[lib]
name = "bvc_relay"
path = "src/lib.rs"

[dependencies]
async-trait = { version = "^0.1" }
common = { path = "../../common", default-features = false }
data-encoding = { version = "^2" }
iroh = { version = "1", default-features = false, features = ["tls-aws-lc-rs"] }
postcard = { version = "^1", features = ["use-std"] }
thiserror = { version = "^2" }
tokio = { version = "^1", features = ["full"] }
tokio-util = { version = "^0.7" }
tracing = { version = "^0.1" }

[dev-dependencies]
async-trait = { version = "^0.1" }
tempfile = { version = "^3" }

