[package]
name = "bvc-relay-service"
version = "0.1.0"
edition = "2024"
publish = false

# Tests live in tests/ mirroring src/, wired through a single aggregator target.
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[lib]
name = "bvc_relay_service"
path = "src/lib.rs"

[[bin]]
name = "bvc-relay-service"
path = "src/main.rs"

[dependencies]
anyhow = { version = "^1" }
anstyle-query = { version = "^1" }
async-trait = { version = "^0.1" }
axum = { version = "^0.8" }
axum-server = { version = "^0.7", features = ["tls-rustls"] }
base64 = { version = "^0.22" }
bvc-relay = { path = "../lib" }
common = { path = "../../common", default-features = false }
getrandom = { version = "^0.3" }
hcl-rs = { version = "^0.19" }
instant-acme = { version = "^0.8" }
iroh = { version = "1", default-features = false, features = ["tls-aws-lc-rs"] }
rustls = { version = "^0.23", default-features = false, features = ["aws-lc-rs"] }
reqwest = { version = "0.12", features = [
    "rustls-tls",
    "json",
], default-features = false }
# Mirror of server/Cargo.toml workspace.dependencies. Keep the version and feature
# set in lockstep when bumping either side.
sea-orm = { version = "^2.0.2", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-migration = { version = "^2.0.2" }
serde = { version = "^1", features = ["derive"] }
socket2 = { version = "^0.5" }
serde_json = { version = "^1" }
thiserror = { version = "^2" }
tokio = { version = "^1", features = ["full"] }
tokio-util = { version = "^0.7" }
tower-http = { version = "^0.6", features = ["cors"] }
tracing-subscriber = { version = "^0.3", features = ["registry"] }
url = { version = "^2" }
x509-parser = { version = "^0.18" }

[dev-dependencies]
rcgen = { version = "^0.14" }
tempfile = { version = "^3" }
time = { version = "^0.3" }
tower = { version = "^0.5" }
