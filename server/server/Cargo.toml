[package]
name = "bedrock-voice-chat-server"
authors = ["Charles R. Portwood II <charlesportwoodii@erianna.com>"]
description = "Bedrock Voice Chat is a voice chat server for Minecraft Bedrock edition."
repository = "https://github.com/alaydriem/bedrock-voice-chat"
version = "1.0.0-beta.20"
edition = "2024"
build = "build.rs"
autotests = false

[lib]
name = "bvc_server_lib"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "bvc-server"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "http"
path = "tests/http/main.rs"

[features]
default = []
ffi = []
bundled-sqlite = []
bedrock = [
    "common/bedrock-server",
    "dep:hickory-proto",
]

[dependencies]
common = { path = "../../common", features = ["quic", "server", "openapi"] }
entity = { path = "../entity" }
migration = { path = "../migration" }
sea-orm = { workspace = true }
sea-orm-rocket = { workspace = true }
clap = { workspace = true }
time = { version = "^0.3.47", features = ["std"] }
chrono = { version = "^0.4", features = ["serde"] }
tokio = { version = "^1", features = ["full"] }
rocket = { version = "^0.5", default-features = false, features = [
    "http2",
    "tls",
    "json",
    "mtls",
] }
# Upgrades a WebSocket inside a Rocket route, so the stream shares the HTTP
# port, TLS and routing table rather than needing a separate listener.
rocket_ws = { version = "^0.1" }
hcl-rs = { version = "^0.19" }
instant-acme = { version = "^0.8" }
anyhow = { version = "^1.0" }
thiserror = { version = "^2" }
serde = { version = "^1", features = ["derive"] }
serde_json = { version = "^1", features = ["raw_value"] }
async-stream = { version = "^0.3" }
async-trait = { version = "^0.1" }
reqwest = { version = "^0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "brotli",
    "gzip",
    "stream",
    "blocking"
] }
tracing = { version = "^0.1" }
tracing-subscriber = { version = "^0.3" }
tracing-appender = { version = "^0.2" }
base64 = { version = "^0.22" }
percent-encoding = { version = "^2" }
faccess = { version = "^0.2" }
bytes = { version = "^1.11.1" }
async-mutex = { version = "^1.4" }
rand = { version = "^0.10" }
ron = { version = "^0.12" }
rcgen = { workspace = true }
rustls-pemfile = { version = "^2.0" }
deadqueue = { version = "^0.2" }
async-once-cell = { version = "^0.5" }
moka = { version = "^0.12", features = [
    "future",
    "sync",
] }
async-channel = { version = "^2.3" }
nanoid = { workspace = true }
blake3 = { version = "^1.8" }
hex = { version = "^0.4" }
argon2 = { version = "^0.5" }
redcon = { version = "^0.1" }
rocket_cors = { version = "^0.6" }
dryoc = { version = "^0.7" }
semver = { version = "^1.0" }
dashmap = { version = "^6" }
cached = { version = "^0.58" }
meridian-proxy = { git = "https://github.com/Alaydriem/meridian", default-features = false, features = ["client"] }
tokio-util = { version = "^0.7" }
ogg = { version = "^0.9" }
uuid = { version = "^1", features = ["v7"] }
schemars = { workspace = true }
okapi = { version = "^0.7" }
rocket_okapi = { version = "0.9", features = ["swagger", "mtls"] }
inventory = { version = "^0.3" }
hickory-proto = { workspace = true, optional = true }
x509-parser = { workspace = true }
sha2 = { version = "^0.10" }
metrics = { version = "^0.24" }
metrics-util = { version = "^0.20" }
metrics-exporter-prometheus = { version = "^0.18", default-features = false }
metrics-exporter-dogstatsd = { version = "^0.9" }
rustls = { version = "^0.23", features = ["aws_lc_rs"] }
iroh = { version = "1", default-features = false, features = ["tls-aws-lc-rs"] }
bvc-relay = { path = "../../relay/lib" }
socket2 = { version = "^0.5" }
tokio-tungstenite = { version = "^0.29" }
tokio-rustls = { version = "^0.26" }
futures-util = { version = "^0.3", default-features = false, features = ["sink"] }
governor = { version = "^0.6" }

dirs = { version = "^5" }
toml = { version = "^0.8" }
keyring-core = { version = "0.5.0" }
constant_time_eq = "0.4"

[build-dependencies]
built = { version = "^0.7", features = ["git2", "chrono", "semver"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "0.1.0" }

[dev-dependencies]
opus2 = { workspace = true }
rodio = { version = "^0.22" }
async-ringbuf = { version = "^0.3" }
ringbuf = { version = "0.4" }
hound = { version = "^3.5" }
read-process-memory ={ version = "^0.1" }
proc_mem = { version = "^0.1"}
tempfile = { version = "^3" }
ring = { version = "^0.17" }
# Test-only. Lets the peer tests drive the object a plugin actually calls rather
# than a hand-built frame that merely resembles what the SDK produces.
bvc-relay-sdk = { path = "../../relay/sdk" }

[target.'cfg(target_env = "musl")'.dependencies]
libsqlite3-sys = { version = "^0.30", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-targets = { version = "^0.53" }
windows-native-keyring-store = { version = "0.1.0" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "^0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[package.metadata.deb]
maintainer = "Charles R. Portwood II <charlesportwoodii@erianna.com>"
copyright = "2022 - Present, Charles R. Portwood II <charlesportwoodii@erianna.com>"
extended-description = """bvc-server is a voice chat server for Minecraft Bedrock Edition."""
depends = "$auto"
section = "utility"
priority = "optional"
revision = "__REVISION__"
assets = [
    [
        "target/release/bvcd",
        "usr/local/bin/",
        "755",
    ],
    [
        "../README.md",
        "usr/share/doc/bvcd/README",
        "644",
    ],
    [
        ".systemd/bvcd.service",
        "etc/systemd/system/bvcd.service",
        "644",
    ],
]
