# Mod Properties
modVersion=1.0.521
mavenGroup=com.alaydriem
archivesBaseName=bedrock-voice-chat

# Simple Voice Chat plugin API, for the SVC bridge. compileOnly everywhere: the
# bridge is optional and the server that runs SVC provides it at runtime.
voicechatApiVersion=2.6.20

# Gradle Settings
org.gradle.jvmargs=-Xmx2G --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED
org.gradle.parallel=true
