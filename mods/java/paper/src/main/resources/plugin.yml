name: BedrockVoiceChat
version: ${version}
main: com.alaydriem.bedrockvoicechat.paper.PaperPlugin
api-version: "26.2"
description: Server-side player position tracking for proximity voice chat
authors:
  - Charles R. Portwood II (Alaydriem)
softdepend:
  - floodgate
  # Soft, because the bridge is optional. Named so SVC registers its service before
  # this plugin looks for it; without the ordering the lookup races the load.
  - voicechat
permissions:
  bvc.disc:
    description: Allow getting a BVC audio disc via /bvc disc
    default: true
  bvc.disc.give:
    description: Allow giving BVC audio discs to other players via /bvc give
    default: op
