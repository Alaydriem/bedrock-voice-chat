# Bedrock Voice Chat Configuration

# URL of the BVC server. Required in external mode.
# Example: https://your-bvc-server.com
bvc-server: ""

# Access token for authentication. Required in external mode.
access-token: ""

# Minimum number of players required before position data is sent.
minimum-players: 1

# Run a BVC server inside this Minecraft server instead of connecting to one.
use-embedded-server: false

# Configuration for the embedded server. Read only when use-embedded-server is
# true. The keys mirror the BVC server's own configuration exactly; anything
# left out takes the server's default.
#
# TLS is required. Use exactly one certificate source:
#
#   tls.play: {}            The BVC registry assigns a *.play.bedrockvc.stream
#                           name and a certificate, and renews both. Needs no
#                           domain. Write the empty braces: "play:" alone is
#                           no block and leaves play mode off.
#   tls.play.address        Optional. The public IP players reach, published as
#                           the name's DNS record. Unset uses the address the
#                           registry sees. An IP address only, never a hostname.
#   enrollment.token        For entitled members: the registry assigns your
#                           reserved name and its certificate. Paste the token
#                           once; it is spent on first start.
#   tls.acme                Obtains a certificate for your own domain over DNS-01.
#   tls.certificate + key   A certificate you already have.
#
# server.port and server.quic_port are worth setting explicitly. Both default to
# 443, which needs root on Linux.
#
# embedded-config:
#   server:
#     port: 8444
#     quic_port: 8443
#     tls:
#       play: {}
#       # Or, for your own certificate, replace the play line with:
#       # certificate: "/path/to/fullchain.pem"
#       # key: "/path/to/privkey.pem"
#       # names:
#       #   - "bvc.example.com"
#   voice:
#     spatial_audio:
#       broadcast_range: 32.0
#   log:
#     level: "info"
#   permissions:
#     defaults:
#       audio_upload: false
#       audio_delete: false
