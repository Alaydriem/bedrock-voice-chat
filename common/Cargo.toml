[package]
name = "common"
version = "0.1.16"
edition = "2024"
# Tests live in tests/ mirroring src/, wired through a single aggregator target
# (tests/integration.rs). Disable auto-discovery so the mirrored files are
# treated as that target's modules rather than each becoming its own binary.
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[test]]
name = "integration"
path = "tests/integration.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "common"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "./src/lib.rs"

[features]
default = []

# Heavy optional features
quic = ["dep:s2n-quic", "dep:s2n-quic-core", "dep:rustls-pemfile"]
audio = ["dep:rodio", "dep:cpal"]
browser = ["dep:webbrowser"]
openapi = ["dep:schemars"]

# Bedrock proxy/realms protocol stack. Pulls in webrtc-rs (patched fork) and
# tokio-raknet (patched fork). Enabled by both client (proxy/realms feature)
# and server (transfer relay feature).
bedrock-protocol = ["dep:bedrock-protocol"]
# Bedrock embedded-server stack. Server-only: brings in BedrockServer/ServerConfig
# for the in-process JNI/embedded path. Implies bedrock-protocol.
bedrock-server = ["dep:bedrock-server", "bedrock-protocol"]

# Server-only feature - enables rocket, sea-orm, and related deps
server = [
    "dep:rocket",
    "dep:sea-orm",
    "dep:sea-orm-rocket",
    "ncryptf-rs/rocket",
    "dep:clap",
    "openapi",
]

[dependencies]
nanoid = { workspace = true }
chrono = { version = "^0.4", features = ["serde"] }
ncryptf-rs = { version = "^0.5", features = ["client"] }
tokio = { version = "^1.38", features = ["full"] }
anyhow = { version = "^1.0" }
url = { version = "^2" }
serde = { version = "^1", features = ["derive"] }
serde_json = { version = "^1", features = ["raw_value"] }
tracing = { version = "^0.1" }
base64 = { version = "^0.22" }
blake3 = { version = "^1.3" }
async-trait = { version = "^0.1" }
async-mutex = { version = "^1.4" }
rand = { version = "^0.10" }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "multipart"], default-features = false }
webbrowser = { version = "^1", optional = true }
ts-rs = { version = "^12.0" }
erased-serde = { version = "^0.4" }
typetag = { version = "^0.2" }
dyn-clone = { version = "^1.0" }
ron = { version = "^0.12" }
moka = { version = "^0.12", features = [
    "future",
    "sync",
] }
postcard = { version = "^1.1", features = [ "use-std", "postcard-derive" ] }
residua-zigzag = { version = "^0.1", package = "residua-zigzag" }
leb128 = { version = "^0.2" }
serde_bytes = { version = "^0.11" }
thiserror = { version = "^2" }
rustls = { version = "^0.23", features = ["aws_lc_rs"] }
sha2 = { version = "^0.10" }
x509-parser = { version = "^0.18" }
rustls-pemfile = { version = "^2.0", optional = true }
s2n-quic = { version = "=1.81.0", default-features = false, features = [
    "provider-address-token-default",
    "provider-tls-rustls",
    "provider-event-tracing",
    "unstable-provider-datagram",
], optional = true }
s2n-quic-core = { version = "=0.81.0", default-features = false, optional = true }
rodio = { version = "^0.22.2", optional = true}
rocket = { version = "^0.5", optional = true, default-features = false, features = [
    "http2",
    "tls",
    "json",
    "mtls",
] }
sea-orm = { version = "^2.0.0-rc.30", optional = true, features = [
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
sea-orm-rocket = { version = "^0.6", optional = true }
clap = { version = "^4", features = ["derive"], optional = true }
schemars = { workspace = true, optional = true }
bedrock-protocol = { git = "https://github.com/alaydriem/bedrock-protocol-rs", tag = "26.40.10", optional = true }
bedrock-server = { git = "https://github.com/alaydriem/bedrock-protocol-rs", tag = "26.40.10", optional = true }

[target."cfg(any(target_os = \"windows\"))".dependencies]
cpal = { version = "^0.17", optional = true, features = ["asio"] }

[target."cfg(not(target_os = \"windows\"))".dependencies]
cpal = { version = "^0.17", optional = true }
