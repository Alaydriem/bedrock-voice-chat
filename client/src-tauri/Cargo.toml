[package]
name = "bedrock-voice-chat-client"
version = "1.0.0-beta.20"
description = "Bedrock Voice Chat Client"
authors = ["Charles R. Portwood II"]
edition = "2024"
default-run = "bedrock-voice-chat-client"
autotests = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bvc_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.4", features = [] }
dotenvy = { version = "^0.15" }

[dependencies]
common = { path = "./../../common", features = ["quic", "audio", "browser", "net"] }
websocket-types = { path = "./../../common/websocket-types" }
tokio = { version = "^1", features = ["full"] }
dirs = { version = "^6", optional = true }

serde = { version = "^1", features = ["derive"] }
base64 = { version = "^0.22" }
serde_json = { version = "^1" }
log = { version = "^0.4" }
anyhow = { version = "^1" }
icu_plurals = { version = "^2.2" }
icu_locale_core = { version = "^2.2" }
spmc = { version = "^0.3" }
rand = { version = "^0.10" }
strum = { version = "0.26", features = ["derive"] }
rodio = { version = "0.22.2" }
bytes = { version = "^1.11.1" }
async-mutex = { version = "^1.4" }
moka = { version = "^0.12", features = ["future", "sync"] }
opus2 = { workspace = true }
ron = { version = "^0.12" }
audio-gate = { version = "^0.2" }
flume = { version = "^0.12" }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }
futures-util = { version = "^0.3" }
tokio-tungstenite = { version = "^0.29", features = ["rustls-tls-webpki-roots"] }
ringbuf = { version = "^0.4" }
ts-rs = { version = "^12.0" }
tauri = { version = "^2", features = ["rustls-tls"] }
tauri-plugin-opener = { version = "^2" }
tauri-plugin-deep-link = { git = "https://github.com/charlesportwoodii/tauri-plugin-deep-link", branch = "master" }
tauri-plugin-fs = { version = "^2" }
tauri-plugin-http = { version = "^2", default-features = false, features = [
  "rustls-tls",
  "charset",
  "cookies",
  "http2",
] }
tauri-plugin-audio-permissions = { git = "https://github.com/charlesportwoodii/tauri-plugin-audio-permissions" }
tauri-plugin-keyring = { git = "https://github.com/charlesportwoodii/tauri-plugin-keyring" }
tauri-plugin-store = { version = "^2" }
tauri-plugin-dialog = { version = "^2" }
tauri-plugin-notification = { version = "^2" }
tauri-plugin-curia = { git = "https://github.com/charlesportwoodii/tauri-plugin-curia", tag = "0.1.2" }
tauri-plugin-os = { version = "^2" }
once_cell = { version = "^1.21", features = ["atomic-polyfill"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "multipart"], default-features = false }
nano-wal = { workspace = true }
# Pinned exactly rather than floated. Precedent: nano-wal 1.0 shipped POSIX-only and broke the
# Windows build, so a storage crate's minor version is not a safe range here. Pure Rust
# deliberately — no C toolchain to cross-compile for Android and iOS, which is the same reason
# SQLite and LMDB were both rejected for this. LMDB also pre-allocates its full map size on
# Windows, which has no sparse files.
redb = "=4.1.0"
uuid = { version = "^1.18", features = ["v4", "v7"] }
postcard = { version = "^1.0", features = ["alloc"] }
bwavfile = { version = "2.0.1" }
chrono = { version = "^0.4" }
fern = { version = "^0.7" }
async-trait = { version = "^0.1" }
enum_dispatch = { version = "^0.3" }
url = { version = "2" }
x509-parser = { workspace = true }
rustls = { version = "0.23" }
rustls-pemfile = { version = "^2.0" }
thiserror = { version = "^2" }
webpki-roots = { version = "^0.26" }
sha2 = { version = "0.10" }
tar = { version = "^0.4" }
zstd = { version = "^0.13" }
sentry = { version = "^0.46", default-features = false, features = [
  "panic", "backtrace", "contexts", "debug-images", "anyhow", "log", "logs", "reqwest", "rustls", "tracing"
] }
tracing = { version = "^0.1" }
tracing-subscriber = { version = "^0.3", default-features = false, features = ["registry"] }
parking_lot = { version = "^0.12" }
rustc-hash = { version = "^2" }
open-feature = { version = "0.3", features = ["serde_json"] }
shiguredo_mp4 = { version = "2026.1.0" }
if-addrs = { workspace = true, optional = true }
tauri-plugin-iap = { version = "=0.10.0-rc.1" }
tauri-plugin-age-signals = { git = "https://github.com/charlesportwoodii/tauri-plugin_age-signals" }

# Desktop Targets
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "^2", features = ["deep-link"] }
tauri-plugin-updater = { version = "^2" }
tauri-plugin-process = { version = "^2" }
tauri-plugin-global-shortcut = { version = "^2" }
sentry-rust-minidump = { version = "^0.14" }

[target."cfg(any(target_os = \"windows\"))".dependencies]
windows-targets = { version = "^0.53.0" }

# Android targets — needed for the ndk_context init shim in src/lib.rs.
# tao 0.35 (Tauri 2.11) stopped initializing ndk-context (tauri-apps/tao#1154);
# we now bridge MainActivity.onCreate -> ndk_context::initialize_android_context
# ourselves so cpal / tauri-plugin-keyring / webbrowser don't panic.
# `jni` is pinned to 0.21 to match tao 0.35's JNI bindings.
[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
libloading = { version = "^0.8" }
tempfile = { version = "^3" }
hound = { version = "^3.5" }
bedrock-server = { git = "https://github.com/alaydriem/bedrock-protocol-rs", tag = "26.40.12" }
bedrock-client = { git = "https://github.com/alaydriem/bedrock-protocol-rs", tag = "26.40.12" }

[[test]]
name = "unit"
path = "tests/unit.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
# `integration` holds the modules that use `bvc_client_lib::testkit`, which is
# gated behind the `e2e` feature. Without this, a plain `cargo test`/`cargo
# nextest run` tries to compile the  target with `testkit` configured out and
# fails. `required-features` makes cargo skip it entirely unless `e2e` is on.
#
# Everything that does NOT need testkit lives in the `unit` target above, so the
# gate costs the fast suite nothing. Adding a module here that does not use
# testkit hides it from `cargo nextest run`.
required-features = ["e2e"]

[features]
default = ["bedrock-protocol"]
bedrock-protocol = [
    "common/bedrock-protocol",
    "dep:if-addrs",
]
# Gates the `testkit` module and the e2e integration test target. The e2e
# harness binary itself lives in its own crate (`client/e2e-harness`) so
# `tauri build` never enumerates it as an app-package bin to bundle.
#
# `dirs` is what `E2eAppData` reclaims through: Tauri resolves app-data from
# `dirs`, not from `%APPDATA%`, so anything that wants to find those directories
# has to ask the same way or it looks in a place Tauri never wrote to.
e2e = ["dep:dirs"]
